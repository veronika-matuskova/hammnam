<!doctype html>
<html lang="sk">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0f172a">
    <meta name="description" content="Spravujte recepty a ich nutričné hodnoty.">
    <title>hamMňam — recepty s prehľadom</title>
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" href="./icons/app-icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="./icons/app-icon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="./config.js"></script>
    <script defer src="./js/app.js?v=16"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  </head>
  <body
    class="min-h-screen bg-slate-50 font-sans text-slate-900 antialiased"
    x-data="recipeApp"
    x-effect="document.documentElement.lang = language"
  >
    <header class="border-b border-slate-200 bg-white">
      <div class="mx-auto flex max-w-6xl items-center justify-between gap-4 px-4 py-4 sm:px-6">
        <a href="./" class="flex items-center gap-3" aria-label="hamMňam — domov">
          <span class="grid h-10 w-10 place-items-center rounded-xl bg-slate-900 text-xl text-white" aria-hidden="true">🍲</span>
          <span>
            <span class="block text-lg font-bold tracking-tight">hamMňam</span>
            <span class="hidden text-xs text-slate-500 sm:block" x-text="t('tagline')"></span>
          </span>
        </a>
        <div class="flex items-center gap-2">
          <a
            href="./learn.html"
            class="inline-flex items-center gap-1.5 rounded-lg border border-slate-200 px-3 py-2 text-sm font-semibold text-slate-700 transition hover:bg-slate-100"
            :aria-label="t('learnLinkLabel')"
            :title="t('learnLinkLabel')"
          >
            <span aria-hidden="true">📖</span><span class="hidden sm:inline" x-text="t('learnLink')"></span>
          </a>
          <button
            x-show="canSwitchLanguage"
            type="button"
            @click="toggleLanguage()"
            class="rounded-lg border border-slate-200 px-3 py-2 text-sm font-semibold text-slate-700 transition hover:bg-slate-100"
            :aria-label="t('switchLanguage')"
            x-text="language.toUpperCase()"
          ></button>
          <span x-show="isSignedIn" x-cloak class="hidden max-w-[12rem] truncate text-xs text-slate-500 md:inline" :title="signedInEmail" x-text="signedInEmail ? `${t('signedInAs')} ${signedInEmail}` : ''"></span>
          <button
            x-show="!isSignedIn"
            type="button"
            @click="openSignIn()"
            class="rounded-lg border border-slate-200 px-3 py-2 text-sm font-semibold text-slate-700 transition hover:bg-slate-100"
            x-text="t('signIn')"
          ></button>
          <button
            x-show="isSignedIn"
            x-cloak
            type="button"
            @click="signOut()"
            class="rounded-lg border border-slate-200 px-3 py-2 text-sm font-semibold text-slate-700 transition hover:bg-slate-100"
            x-text="t('signOut')"
          ></button>
          <button
            x-show="canEdit && !selectedRecipe && !showForm"
            x-cloak
            type="button"
            @click="openForm()"
            class="rounded-lg bg-slate-900 px-4 py-2 text-sm font-semibold text-white shadow-sm transition hover:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-slate-400 focus:ring-offset-2"
            x-text="t('newRecipe')"
          ></button>
        </div>
      </div>
    </header>

    <section x-show="!isSignedIn && (showSignIn || showForm)" x-cloak class="mx-auto mt-6 max-w-md px-4 sm:px-6" aria-labelledby="sign-in-title">
      <div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
        <div class="flex items-start justify-between gap-3">
          <h2 id="sign-in-title" class="text-lg font-semibold text-slate-900" x-text="t('signInTitle')"></h2>
          <button x-show="!showForm" type="button" @click="showSignIn = false; authError = ''" :aria-label="t('close')" class="shrink-0 text-lg font-semibold leading-none text-slate-500">&times;</button>
        </div>
        <p class="mt-1 text-sm text-slate-600" x-text="showForm ? t('signInToEdit') : t('signInIntro')"></p>
        <form @submit.prevent="requestMagicLink()" class="mt-4 flex flex-col gap-2 sm:flex-row">
          <label class="min-w-0 flex-1">
            <span class="sr-only" x-text="t('email')"></span>
            <input type="email" x-model.trim="signInEmail" required autocomplete="email" :placeholder="t('email')" class="w-full rounded-lg border border-slate-200 px-3 py-2.5 text-sm outline-none focus:border-slate-400 focus:ring-2 focus:ring-slate-100">
          </label>
          <button type="submit" :disabled="authSending" class="rounded-lg bg-slate-900 px-4 py-2.5 text-sm font-semibold text-white hover:bg-slate-700 disabled:cursor-wait disabled:opacity-60" x-text="authSending ? t('sendingMagicLink') : t('sendMagicLink')"></button>
        </form>
        <p x-show="magicLinkSent" class="mt-3 rounded-lg bg-emerald-50 p-3 text-sm text-emerald-800" role="status" x-text="t('magicLinkSent')"></p>
        <p x-show="authError" class="mt-3 rounded-lg bg-red-50 p-3 text-sm text-red-700" role="alert" x-text="authError"></p>
        <button x-show="showForm" type="button" @click="closeForm()" class="mt-4 text-sm font-semibold text-slate-600 hover:text-slate-950" x-text="t('backToRecipes')"></button>
      </div>
    </section>
    <p x-show="isSignedIn && familyMember === false" x-cloak class="mx-auto mt-4 max-w-6xl px-4 text-sm text-amber-800 sm:px-6" role="status" x-text="t('notFamilyMember')"></p>

    <main x-show="!selectedRecipe && !showForm" class="mx-auto max-w-6xl px-4 py-8 sm:px-6 sm:py-10">
      <section class="mb-8">
        <p class="mb-2 text-sm font-semibold uppercase tracking-widest text-slate-500" x-text="t('eyebrow')"></p>
        <div class="flex flex-col justify-between gap-4 sm:flex-row sm:items-end">
          <div>
            <h1 class="text-3xl font-bold tracking-tight text-slate-950 sm:text-4xl" x-text="t('heading')"></h1>
            <p class="mt-2 max-w-2xl text-slate-600" x-text="t('intro')"></p>
          </div>
          <p class="text-sm text-slate-500" aria-live="polite">
            <span x-text="recipeCountLabel(filteredRecipes.length)"></span>
          </p>
        </div>
      </section>

      <section class="mb-6 grid gap-3 rounded-2xl border border-slate-200 bg-white p-4 shadow-sm sm:grid-cols-[1fr_auto_auto]">
        <label class="relative block">
          <span class="sr-only" x-text="t('search')"></span>
          <svg class="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path>
          </svg>
          <input
            type="search"
            x-model="search"
            :placeholder="t('search')"
            class="w-full rounded-lg border border-slate-200 bg-white py-2.5 pl-9 pr-3 text-sm outline-none transition placeholder:text-slate-400 focus:border-slate-400 focus:ring-2 focus:ring-slate-100"
          >
        </label>
        <label>
          <span class="sr-only" x-text="t('category')"></span>
          <select x-model="selectedCategory" class="w-full rounded-lg border border-slate-200 bg-white px-3 py-2.5 text-sm text-slate-700 outline-none focus:border-slate-400 focus:ring-2 focus:ring-slate-100 sm:min-w-40">
            <option value="" x-text="t('allCategories')"></option>
            <template x-for="category in categories" :key="category">
              <option :value="category" x-text="category"></option>
            </template>
          </select>
        </label>
        <div class="grid grid-cols-2 gap-3 sm:flex">
          <button
            type="button"
            @click="favoritesOnly = !favoritesOnly"
            :aria-pressed="favoritesOnly"
            class="rounded-lg border px-3 py-2.5 text-sm font-medium transition"
            :class="favoritesOnly ? 'border-amber-300 bg-amber-50 text-amber-800' : 'border-slate-200 text-slate-600 hover:bg-slate-50'"
          >
            <span aria-hidden="true">★</span>
            <span x-text="t('favorites')"></span>
          </button>
          <button
            type="button"
            @click="showNutritionFilters = !showNutritionFilters"
            :aria-expanded="showNutritionFilters"
            aria-controls="nutrition-filters-panel"
            class="inline-flex items-center justify-center gap-1.5 rounded-lg border px-3 py-2.5 text-sm font-medium transition"
            :class="activeNutritionFilterCount ? 'border-emerald-300 bg-emerald-50 text-emerald-800' : 'border-slate-200 text-slate-600 hover:bg-slate-50'"
          >
            <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M4 6h16M7 12h10M10 18h4"></path>
            </svg>
            <span x-text="t('nutritionFilters')"></span>
            <span
              x-show="activeNutritionFilterCount"
              x-cloak
              class="inline-flex h-5 min-w-[1.25rem] items-center justify-center rounded-full bg-emerald-700 px-1.5 text-xs font-semibold text-white"
              aria-hidden="true"
              x-text="activeNutritionFilterCount"
            ></span>
            <span x-show="activeNutritionFilterCount" class="sr-only" x-text="tf('nutritionFiltersActive', { count: activeNutritionFilterCount })"></span>
          </button>
        </div>
        <div
          id="nutrition-filters-panel"
          x-show="showNutritionFilters"
          x-cloak
          class="border-t border-slate-200 pt-3 sm:col-span-3"
          role="group"
          aria-labelledby="nutrition-filters-heading"
        >
          <div class="mb-3 flex items-start justify-between gap-3">
            <div class="min-w-0">
              <h2 id="nutrition-filters-heading" class="text-sm font-semibold text-slate-800" x-text="t('nutritionFiltersHeading')"></h2>
              <p class="mt-0.5 text-xs text-slate-500" x-text="tf('nutritionFiltersNote', { factor: sjFactor })"></p>
            </div>
            <button
              type="button"
              @click="resetNutritionFilters()"
              :disabled="!activeNutritionFilterCount"
              class="shrink-0 rounded-lg border border-slate-200 px-3 py-1.5 text-xs font-semibold text-slate-600 transition hover:bg-slate-50 disabled:cursor-default disabled:opacity-50"
              x-text="t('resetFilters')"
            ></button>
          </div>
          <div class="grid gap-3 sm:grid-cols-2 lg:grid-cols-4">
            <template x-for="filter in nutritionFilterFields" :key="filter.field">
              <fieldset class="min-w-0">
                <legend class="mb-1 text-xs font-medium text-slate-600" x-text="t(filter.labelKey)"></legend>
                <div class="flex items-center gap-2">
                  <input
                    type="text"
                    inputmode="decimal"
                    x-model.trim="nutritionFilters[filter.field].min"
                    :placeholder="t('filterMin')"
                    :aria-label="`${t(filter.labelKey)} ${t('filterMin')}`"
                    :aria-invalid="isFilterBoundInvalid(nutritionFilters[filter.field].min)"
                    class="w-full min-w-0 rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm outline-none placeholder:text-slate-400 focus:border-slate-400 focus:ring-2 focus:ring-slate-100"
                    :class="isFilterBoundInvalid(nutritionFilters[filter.field].min) ? 'border-red-300' : ''"
                  >
                  <span class="text-slate-400" aria-hidden="true">–</span>
                  <input
                    type="text"
                    inputmode="decimal"
                    x-model.trim="nutritionFilters[filter.field].max"
                    :placeholder="t('filterMax')"
                    :aria-label="`${t(filter.labelKey)} ${t('filterMax')}`"
                    :aria-invalid="isFilterBoundInvalid(nutritionFilters[filter.field].max)"
                    class="w-full min-w-0 rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm outline-none placeholder:text-slate-400 focus:border-slate-400 focus:ring-2 focus:ring-slate-100"
                    :class="isFilterBoundInvalid(nutritionFilters[filter.field].max) ? 'border-red-300' : ''"
                  >
                  <span class="w-9 shrink-0 text-xs font-semibold text-slate-500" x-text="filter.unit"></span>
                </div>
                <p
                  x-show="isFilterBoundInvalid(nutritionFilters[filter.field].min) || isFilterBoundInvalid(nutritionFilters[filter.field].max)"
                  x-cloak
                  class="mt-1 text-xs text-red-700"
                  x-text="t('filterInvalid')"
                ></p>
              </fieldset>
            </template>
          </div>
        </div>
      </section>

      <div x-show="loading" class="rounded-2xl border border-slate-200 bg-white px-6 py-12 text-center text-sm text-slate-500" role="status" x-text="t('loading')"></div>
      <div x-show="errorMessage" x-cloak class="mb-5 rounded-xl border border-red-200 bg-red-50 p-4 text-sm text-red-800" role="alert">
        <p class="font-semibold" x-text="t('errorTitle')"></p>
        <p class="mt-1" x-text="errorMessage"></p>
        <button type="button" @click="fetchRecipes()" class="mt-3 font-semibold underline underline-offset-2" x-text="t('retry')"></button>
      </div>
      <div x-show="favoriteErrorMessage" x-cloak class="mb-5 flex items-start justify-between gap-3 rounded-lg bg-red-50 p-3 text-sm text-red-700" role="alert">
        <p x-text="favoriteErrorMessage"></p>
        <button type="button" @click="favoriteErrorMessage = ''" :aria-label="t('close')" class="shrink-0 font-semibold leading-none">&times;</button>
      </div>

      <section x-show="!loading" class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
        <template x-for="recipe in filteredRecipes" :key="recipe.id">
          <article class="group relative overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm transition hover:-translate-y-0.5 hover:shadow-md">
            <button
              type="button"
              @click="openRecipe(recipe)"
              :aria-label="`${t('openRecipe')}: ${displayTitle(recipe)}`"
              class="absolute inset-0 z-0 rounded-2xl focus:outline-none focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-slate-500"
            ></button>
            <div class="pointer-events-none relative z-10">
              <div x-show="recipe.photo" class="aspect-[16/9] overflow-hidden bg-slate-100">
                <img :src="recipe.photo" :alt="displayTitle(recipe)" loading="lazy" class="h-full w-full object-cover transition duration-300 group-hover:scale-[1.02]">
              </div>
              <div class="p-5">
                <div class="flex items-start justify-between gap-3">
                  <div class="min-w-0 pr-12">
                    <p class="mb-1 text-xs font-medium uppercase tracking-wide text-slate-500" x-text="displayCategory(recipe)"></p>
                    <h2 class="text-lg font-semibold leading-snug text-slate-900" x-text="displayTitle(recipe)"></h2>
                  </div>
                </div>
                <div class="mt-5 flex flex-wrap gap-2">
                  <span class="inline-flex items-center gap-1.5 rounded-full bg-emerald-50 px-3 py-1.5 text-xs font-semibold text-emerald-800">
                    <span class="text-emerald-600">SJ</span><span x-text="displayValue(recipe.sj)"></span><span class="font-normal opacity-70" x-text="t('per100gSuffix')"></span>
                  </span>
                  <span
                    x-show="recipePortionSj(recipe) !== null"
                    class="inline-flex items-center gap-1.5 rounded-full bg-emerald-100 px-3 py-1.5 text-xs font-semibold text-emerald-900"
                  >
                    <span class="text-emerald-700">SJ</span><span x-text="formatNumber(recipePortionSj(recipe))"></span><span class="font-normal opacity-70" x-text="t('perPortionSuffix')"></span>
                  </span>
                  <span class="inline-flex items-center gap-1.5 rounded-full bg-blue-50 px-3 py-1.5 text-xs font-semibold text-blue-800">
                    <span x-text="t('carbsShort')"></span><span x-text="displayMetric(recipe.carbs, 'g')"></span><span class="font-normal opacity-70" x-text="t('per100gSuffix')"></span>
                  </span>
                  <span class="inline-flex items-center gap-1.5 rounded-full bg-amber-50 px-3 py-1.5 text-xs font-semibold text-amber-800">
                    <span x-text="displayMetric(recipe.calories, 'kcal')"></span><span class="font-normal opacity-70" x-text="t('per100gSuffix')"></span>
                  </span>
                  <span
                    class="inline-flex items-center gap-1.5 rounded-full px-3 py-1.5 text-xs font-semibold"
                    :class="giClass(recipe.gi)"
                  >
                    <span>GI</span><span x-text="displayGi(recipe.gi)"></span>
                  </span>
                </div>
              </div>
            </div>
            <span
              x-show="!canEdit && recipe.favorite"
              class="pointer-events-none absolute right-4 top-4 z-20 rounded-lg bg-white/90 p-2 text-xl leading-none text-amber-500"
              :title="t('favorites')"
            >★</span>
            <button
              x-show="canEdit"
              type="button"
              @click="toggleFavorite(recipe)"
              :disabled="isFavoriteSaving(recipe)"
              :aria-busy="isFavoriteSaving(recipe)"
              :aria-label="recipe.favorite ? t('removeFavorite') : t('addFavorite')"
              :aria-pressed="Boolean(recipe.favorite)"
              class="pointer-events-auto absolute right-4 top-4 z-20 rounded-lg bg-white/90 p-2 text-xl leading-none transition hover:bg-amber-50 disabled:cursor-wait disabled:opacity-60"
              :class="recipe.favorite ? 'text-amber-500' : 'text-slate-300 hover:text-amber-500'"
            >★</button>
          </article>
        </template>
      </section>

      <div x-show="!loading && !errorMessage && filteredRecipes.length === 0" class="rounded-2xl border border-dashed border-slate-300 bg-white px-6 py-14 text-center">
        <p class="text-lg font-semibold text-slate-800" x-text="recipes.length ? t('noMatches') : t('emptyTitle')"></p>
        <p class="mt-2 text-sm text-slate-500" x-text="recipes.length ? t('changeFilters') : t('emptyDescription')"></p>
        <button x-show="canEdit && recipes.length === 0" type="button" @click="openForm()" class="mt-5 rounded-lg bg-slate-900 px-4 py-2 text-sm font-semibold text-white hover:bg-slate-700" x-text="t('newRecipe')"></button>
      </div>
    </main>

    <main x-show="selectedRecipe" x-cloak class="mx-auto max-w-4xl px-4 py-6 sm:px-6 sm:py-10">
      <article class="overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm">
        <div class="flex items-center justify-between border-b border-slate-200 px-5 py-3 sm:px-7">
          <button
            type="button"
            @click="closeRecipe()"
            class="inline-flex items-center gap-2 rounded-lg px-2 py-2 text-sm font-semibold text-slate-600 transition hover:bg-slate-100 hover:text-slate-900 focus:outline-none focus:ring-2 focus:ring-slate-400"
          >
            <span aria-hidden="true">←</span><span x-text="t('backToRecipes')"></span>
          </button>
          <button
            x-show="canEdit"
            type="button"
            @click="editRecipe(selectedRecipe)"
            class="rounded-lg bg-slate-900 px-4 py-2 text-sm font-semibold text-white transition hover:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-slate-400 focus:ring-offset-2"
            x-text="t('editRecipe')"
          ></button>
        </div>
        <div class="p-5 sm:p-7">
          <img
            x-show="selectedRecipe && selectedRecipe.photo"
            :src="selectedRecipe && selectedRecipe.photo"
            :alt="selectedRecipe ? displayTitle(selectedRecipe) : ''"
            class="mb-6 max-h-[28rem] w-full rounded-xl object-cover"
          >
          <div class="mb-6">
            <span
              x-show="selectedRecipe && displayCategory(selectedRecipe)"
              class="inline-flex rounded-full bg-slate-100 px-3 py-1 text-xs font-semibold text-slate-700"
              x-text="selectedRecipe ? displayCategory(selectedRecipe) : ''"
            ></span>
            <h2 id="recipe-detail-title" class="mt-3 text-2xl font-bold tracking-tight text-slate-950 sm:text-3xl" x-text="selectedRecipe ? displayTitle(selectedRecipe) : ''"></h2>
          </div>

          <div x-show="selectedRecipe && (sideRecipe(selectedRecipe) || mainRecipes(selectedRecipe).length)" class="mb-8 space-y-2">
            <template x-for="side in selectedRecipe && sideRecipe(selectedRecipe) ? [sideRecipe(selectedRecipe)] : []" :key="side.id">
              <button type="button" @click="openLinkedRecipe(side)" class="flex w-full items-center gap-3 rounded-xl border border-slate-200 bg-slate-50/70 p-3 text-left transition hover:bg-slate-100 focus:outline-none focus:ring-2 focus:ring-slate-400">
                <img x-show="side.photo" :src="side.photo" alt="" class="h-12 w-12 shrink-0 rounded-lg object-cover">
                <span class="min-w-0 flex-1">
                  <span class="block text-xs font-semibold uppercase tracking-wide text-slate-500" x-text="t('sideDish')"></span>
                  <span class="block truncate text-sm font-semibold text-slate-900" x-text="displayTitle(side)"></span>
                </span>
                <span aria-hidden="true" class="text-slate-400">→</span>
              </button>
            </template>
            <template x-for="main in selectedRecipe ? mainRecipes(selectedRecipe) : []" :key="main.id">
              <button type="button" @click="openLinkedRecipe(main)" class="flex w-full items-center gap-3 rounded-xl border border-slate-200 bg-slate-50/70 p-3 text-left transition hover:bg-slate-100 focus:outline-none focus:ring-2 focus:ring-slate-400">
                <img x-show="main.photo" :src="main.photo" alt="" class="h-12 w-12 shrink-0 rounded-lg object-cover">
                <span class="min-w-0 flex-1">
                  <span class="block text-xs font-semibold uppercase tracking-wide text-slate-500" x-text="t('mainDish')"></span>
                  <span class="block truncate text-sm font-semibold text-slate-900" x-text="displayTitle(main)"></span>
                </span>
                <span aria-hidden="true" class="text-slate-400">→</span>
              </button>
            </template>
          </div>

          <div x-show="selectedRecipe && (selectedRecipe.servings != null || selectedRecipe.total_weight != null)" class="mb-8 rounded-2xl border border-slate-200 bg-slate-50/70 p-4 sm:p-5">
            <p class="text-sm font-semibold text-slate-900" x-text="t('totalRecipeValues')"></p>
            <div class="mt-3 grid grid-cols-2 gap-3">
              <div x-show="selectedRecipe && selectedRecipe.servings != null">
                <p class="text-[11px] font-medium uppercase tracking-wide text-slate-500" x-text="t('servings')"></p>
                <p class="mt-1 text-base font-bold text-slate-900" x-text="selectedRecipe ? displayValue(selectedRecipe.servings) : '—'"></p>
              </div>
              <div x-show="selectedRecipe && selectedRecipe.total_weight != null">
                <p class="text-[11px] font-medium uppercase tracking-wide text-slate-500" x-text="t('totalWeight')"></p>
                <p class="mt-1 text-base font-bold text-slate-900" x-text="selectedRecipe ? displayMetric(selectedRecipe.total_weight, 'g') : '—'"></p>
                <p class="mt-1 text-xs text-slate-500" x-text="t('totalWeightNote')"></p>
              </div>
            </div>
          </div>

          <section class="mb-8" aria-labelledby="detail-portion-heading">

              <label class="block text-sm font-medium text-slate-700">
                <span x-text="t('servings')"></span>
                <input type="text" inputmode="decimal" x-model.trim="newRecipe.servings" class="mt-1.5 w-full rounded-lg border border-slate-200 bg-white px-3 py-2.5 outline-none focus:border-slate-400 focus:ring-2 focus:ring-slate-100">
              </label>
              <label class="block text-sm font-medium text-slate-700">
                <span x-text="t('totalWeight')"></span>
                <input type="text" inputmode="decimal" x-model.trim="newRecipe.total_weight" class="mt-1.5 w-full rounded-lg border border-slate-200 bg-white px-3 py-2.5 outline-none focus:border-slate-400 focus:ring-2 focus:ring-slate-100">
              </label>
            </div>
          </section>
          <section class="rounded-xl border border-slate-200 bg-slate-50/70 p-4" aria-labelledby="ingredients-heading">
            <div class="mb-3 flex items-center justify-between gap-3">
              <h3 id="ingredients-heading" class="text-sm font-semibold text-slate-800" x-text="t('ingredients')"></h3>
              <button
                type="button"
                @click="newRecipe.ingredients.push({ name: '', amount: '', unit: '' })"
                class="rounded-lg border border-slate-200 bg-white px-3 py-1.5 text-sm font-semibold text-slate-700 transition hover:bg-slate-100"
                x-text="t('addIngredient')"
              ></button>
            </div>
            <div class="space-y-3">
              <template x-for="(ingredient, index) in newRecipe.ingredients" :key="index">
                <div class="grid gap-2 sm:grid-cols-[minmax(0,1fr)_minmax(0,0.65fr)_minmax(0,0.65fr)_auto] sm:items-end">
                  <label class="block text-xs font-medium text-slate-600">
                    <span x-text="t('ingredientName')"></span>
                    <input type="text" x-model.trim="ingredient.name" maxlength="120" class="mt-1 w-full rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm text-slate-900 outline-none focus:border-slate-400 focus:ring-2 focus:ring-slate-100">
                  </label>
                  <label class="block text-xs font-medium text-slate-600">
                    <span x-text="t('amount')"></span>
                    <input type="text" x-model.trim="ingredient.amount" maxlength="40" class="mt-1 w-full rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm text-slate-900 outline-none focus:border-slate-400 focus:ring-2 focus:ring-slate-100">
                  </label>
                  <label class="block text-xs font-medium text-slate-600">
                    <span x-text="t('unit')"></span>
                    <input type="text" x-model.trim="ingredient.unit" maxlength="40" class="mt-1 w-full rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm text-slate-900 outline-none focus:border-slate-400 focus:ring-2 focus:ring-slate-100">
                  </label>
                  <button
                    type="button"
                    @click="newRecipe.ingredients.splice(index, 1)"
                    :aria-label="t('removeIngredient')"
                    class="rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm font-semibold text-slate-500 transition hover:border-red-200 hover:bg-red-50 hover:text-red-700"
                  >×</button>
                </div>
              </template>
            </div>
          </section>
          <section class="rounded-xl border border-slate-200 bg-slate-50/70 p-4" aria-labelledby="steps-heading">
            <div class="mb-3 flex items-center justify-between gap-3">
              <h3 id="steps-heading" class="text-sm font-semibold text-slate-800" x-text="t('steps')"></h3>
              <button
                type="button"
                @click="newRecipe.steps.push('')"
                class="rounded-lg border border-slate-200 bg-white px-3 py-1.5 text-sm font-semibold text-slate-700 transition hover:bg-slate-100"
                x-text="t('addStep')"
              ></button>
            </div>
            <div class="space-y-2">
              <template x-for="(step, index) in newRecipe.steps" :key="index">
                <div class="flex items-start gap-2">
                  <label class="min-w-0 flex-1 text-xs font-medium text-slate-600">
                    <span><span x-text="t('step')"></span> <span x-text="index + 1"></span></span>
                    <textarea x-model.trim="newRecipe.steps[index]" rows="2" maxlength="1000" class="mt-1 w-full resize-y rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm text-slate-900 outline-none focus:border-slate-400 focus:ring-2 focus:ring-slate-100"></textarea>
                  </label>
                  <button
                    type="button"
                    @click="newRecipe.steps.splice(index, 1)"
                    :aria-label="t('removeStep')"
                    class="mt-5 rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm font-semibold text-slate-500 transition hover:border-red-200 hover:bg-red-50 hover:text-red-700"
                  >×</button>
                </div>
              </template>
            </div>
          </section>
          <label class="block text-sm font-medium text-slate-700">
            <span x-text="t('notes')"></span>
            <textarea x-model.trim="newRecipe.notes" rows="3" maxlength="2000" :placeholder="t('notesPlaceholder')" class="mt-1.5 w-full resize-y rounded-lg border border-slate-200 px-3 py-2.5 outline-none placeholder:text-slate-400 focus:border-slate-400 focus:ring-2 focus:ring-slate-100"></textarea>
          </label>
          <label class="block text-sm font-medium text-slate-700">
            <span x-text="t('sideDishField')"></span>
            <select x-model="newRecipe.side_recipe_id" class="mt-1.5 w-full rounded-lg border border-slate-200 bg-white px-3 py-2.5 outline-none focus:border-slate-400 focus:ring-2 focus:ring-slate-100">
              <option value="" x-text="t('noSideDish')"></option>
              <template x-for="option in sideRecipeOptions" :key="option.id">
                <option :value="option.id" :selected="String(newRecipe.side_recipe_id ?? '') === option.id" x-text="option.title"></option>
              </template>
            </select>
            <span class="mt-1 block text-xs font-normal text-slate-500" x-text="t('sideDishHint')"></span>
          </label>
          <label class="block text-sm font-medium text-slate-700">
            <span x-text="t('photoUrl')"></span>
            <input type="url" x-model.trim="newRecipe.photo" maxlength="2048" class="mt-1.5 w-full rounded-lg border border-slate-200 px-3 py-2.5 outline-none focus:border-slate-400 focus:ring-2 focus:ring-slate-100">
          </label>
          <p x-show="formError" x-cloak class="rounded-lg bg-red-50 p-3 text-sm text-red-700" role="alert" x-text="formError"></p>
          <div class="flex flex-col-reverse gap-2 pt-2 sm:flex-row sm:justify-end">
            <button type="button" @click="closeForm()" class="rounded-lg border border-slate-200 px-4 py-2.5 text-sm font-semibold text-slate-700 hover:bg-slate-50" x-text="t('cancel')"></button>
            <button type="submit" :disabled="saving" class="rounded-lg bg-slate-900 px-5 py-2.5 text-sm font-semibold text-white hover:bg-slate-700 disabled:cursor-not-allowed disabled:opacity-60" x-text="saving ? t('saving') : t(editingRecipeId !== null ? 'updateRecipe' : 'saveRecipe')"></button>
          </div>
        </form>
      </section>
    </main>

    <footer class="border-t border-slate-200 bg-white py-5 text-center text-xs text-slate-500">
      hamMňam <span aria-hidden="true">·</span> <span x-text="t('footer')"></span>
    </footer>
    <style>[x-cloak] { display: none !important; }</style>
  </body>
</html>
