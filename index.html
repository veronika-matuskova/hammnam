<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0f172a">
    <meta name="description" content="Spravujte recepty a jejich nutriční hodnoty.">
    <title>hamMňam — recepty s přehledem</title>
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" href="./icons/app-icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="./icons/app-icon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="./config.js"></script>
    <script defer src="./js/app.js?v=2"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  </head>
  <body
    class="min-h-screen bg-slate-50 font-sans text-slate-900 antialiased"
    x-data="recipeApp"
    x-effect="document.documentElement.lang = language"
  >
    <header class="border-b border-slate-200 bg-white">
      <div class="mx-auto flex max-w-6xl items-center justify-between gap-4 px-4 py-4 sm:px-6">
        <a href="./" class="flex items-center gap-3" aria-label="hamMňam — domů">
          <span class="grid h-10 w-10 place-items-center rounded-xl bg-slate-900 text-xl text-white" aria-hidden="true">🍲</span>
          <span>
            <span class="block text-lg font-bold tracking-tight">hamMňam</span>
            <span class="hidden text-xs text-slate-500 sm:block" x-text="t('tagline')"></span>
          </span>
        </a>
        <div class="flex items-center gap-2">
          <button
            type="button"
            @click="toggleLanguage()"
            class="rounded-lg border border-slate-200 px-3 py-2 text-sm font-semibold text-slate-700 transition hover:bg-slate-100"
            :aria-label="t('switchLanguage')"
            x-text="language.toUpperCase()"
          ></button>
          <button
            x-show="!selectedRecipe"
            type="button"
            @click="openForm()"
            class="rounded-lg bg-slate-900 px-4 py-2 text-sm font-semibold text-white shadow-sm transition hover:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-slate-400 focus:ring-offset-2"
            x-text="t('newRecipe')"
          ></button>
        </div>
      </div>
    </header>

    <main x-show="!selectedRecipe" class="mx-auto max-w-6xl px-4 py-8 sm:px-6 sm:py-10">
      <section class="mb-8">
        <p class="mb-2 text-sm font-semibold uppercase tracking-widest text-slate-500" x-text="t('eyebrow')"></p>
        <div class="flex flex-col justify-between gap-4 sm:flex-row sm:items-end">
          <div>
            <h1 class="text-3xl font-bold tracking-tight text-slate-950 sm:text-4xl" x-text="t('heading')"></h1>
            <p class="mt-2 max-w-2xl text-slate-600" x-text="t('intro')"></p>
          </div>
          <p class="text-sm text-slate-500" aria-live="polite">
            <span x-text="filteredRecipes.length"></span>
            <span x-text="t('recipeCount')"></span>
          </p>
        </div>
      </section>

      <section class="mb-6 grid gap-3 rounded-2xl border border-slate-200 bg-white p-4 shadow-sm sm:grid-cols-[1fr_auto_auto]">
        <label class="relative block">
          <span class="sr-only" x-text="t('search')"></span>
          <svg class="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path>
          </svg>
          <input
            type="search"
            x-model="search"
            :placeholder="t('search')"
            class="w-full rounded-lg border border-slate-200 bg-white py-2.5 pl-9 pr-3 text-sm outline-none transition placeholder:text-slate-400 focus:border-slate-400 focus:ring-2 focus:ring-slate-100"
          >
        </label>
        <label>
          <span class="sr-only" x-text="t('category')"></span>
          <select x-model="selectedCategory" class="w-full rounded-lg border border-slate-200 bg-white px-3 py-2.5 text-sm text-slate-700 outline-none focus:border-slate-400 focus:ring-2 focus:ring-slate-100 sm:min-w-40">
            <option value="" x-text="t('allCategories')"></option>
            <template x-for="category in categories" :key="category">
              <option :value="category" x-text="category"></option>
            </template>
          </select>
        </label>
        <button
          type="button"
          @click="favoritesOnly = !favoritesOnly"
          :aria-pressed="favoritesOnly"
          class="rounded-lg border px-3 py-2.5 text-sm font-medium transition"
          :class="favoritesOnly ? 'border-amber-300 bg-amber-50 text-amber-800' : 'border-slate-200 text-slate-600 hover:bg-slate-50'"
        >
          <span aria-hidden="true">★</span>
          <span x-text="t('favorites')"></span>
        </button>
      </section>

      <div x-show="loading" class="rounded-2xl border border-slate-200 bg-white px-6 py-12 text-center text-sm text-slate-500" role="status" x-text="t('loading')"></div>
      <div x-show="errorMessage" x-cloak class="mb-5 rounded-xl border border-red-200 bg-red-50 p-4 text-sm text-red-800" role="alert">
        <p class="font-semibold" x-text="t('errorTitle')"></p>
        <p class="mt-1" x-text="errorMessage"></p>
        <button type="button" @click="fetchRecipes()" class="mt-3 font-semibold underline underline-offset-2" x-text="t('retry')"></button>
      </div>

      <section x-show="!loading" class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
        <template x-for="recipe in filteredRecipes" :key="recipe.id">
          <article class="group relative overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm transition hover:-translate-y-0.5 hover:shadow-md">
            <button
              type="button"
              @click="openRecipe(recipe)"
              :aria-label="`${t('openRecipe')}: ${displayTitle(recipe)}`"
              class="absolute inset-0 z-0 rounded-2xl focus:outline-none focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-slate-500"
            ></button>
            <div class="pointer-events-none relative z-10">
              <div x-show="recipe.photo" class="aspect-[16/9] overflow-hidden bg-slate-100">
                <img :src="recipe.photo" :alt="displayTitle(recipe)" loading="lazy" class="h-full w-full object-cover transition duration-300 group-hover:scale-[1.02]">
              </div>
              <div class="p-5">
                <div class="flex items-start justify-between gap-3">
                  <div class="min-w-0 pr-12">
                    <p class="mb-1 text-xs font-medium uppercase tracking-wide text-slate-500" x-text="displayCategory(recipe)"></p>
                    <h2 class="text-lg font-semibold leading-snug text-slate-900" x-text="displayTitle(recipe)"></h2>
                  </div>
                </div>
                <div class="mt-5 flex flex-wrap gap-2">
                  <span class="inline-flex items-center gap-1.5 rounded-full bg-emerald-50 px-3 py-1.5 text-xs font-semibold text-emerald-800">
                    <span class="text-emerald-600">SJ</span><span x-text="displayValue(recipe.sj)"></span>
                  </span>
                  <span class="inline-flex items-center gap-1.5 rounded-full bg-blue-50 px-3 py-1.5 text-xs font-semibold text-blue-800">
                    <span x-text="t('carbsShort')"></span><span x-text="displayMetric(recipe.carbs, 'g')"></span>
                  </span>
                  <span
                    class="inline-flex items-center gap-1.5 rounded-full px-3 py-1.5 text-xs font-semibold"
                    :class="giClass(recipe.gi)"
                  >
                    <span>GI</span><span x-text="displayValue(recipe.gi)"></span>
                  </span>
                </div>
                <div class="mt-4 overflow-x-auto rounded-xl border border-slate-200">
                  <table class="min-w-[36rem] divide-y divide-slate-200 text-left text-[11px]">
                    <thead class="bg-slate-50">
                      <tr>
                        <th class="px-2 py-2 font-semibold text-slate-600">SJ</th>
                        <th class="px-2 py-2 font-semibold text-slate-600" x-text="t('carbsShort')"></th>
                        <th class="px-2 py-2 font-semibold text-slate-600" x-text="t('fiber')"></th>
                        <th class="px-2 py-2 font-semibold text-slate-600" x-text="t('calories')"></th>
                        <th class="px-2 py-2 font-semibold text-slate-600" x-text="t('proteins')"></th>
                        <th class="px-2 py-2 font-semibold text-slate-600" x-text="t('fats')"></th>
                        <th class="px-2 py-2 font-semibold text-slate-600" x-text="t('salt')"></th>
                        <th class="px-2 py-2 font-semibold text-slate-600">GL</th>
                      </tr>
                    </thead>
                    <tbody>
                      <tr class="bg-white text-slate-700">
                        <td class="px-2 py-2" x-text="displayValue(recipe.sj)"></td>
                        <td class="px-2 py-2" x-text="displayMetric(recipe.carbs, 'g')"></td>
                        <td class="px-2 py-2" x-text="displayMetric(recipe.fiber, 'g')"></td>
                        <td class="px-2 py-2" x-text="displayMetric(recipe.calories, 'kcal')"></td>
                        <td class="px-2 py-2" x-text="displayMetric(recipe.proteins, 'g')"></td>
                        <td class="px-2 py-2" x-text="displayMetric(recipe.fats, 'g')"></td>
                        <td class="px-2 py-2" x-text="displayMetric(recipe.salt, 'g')"></td>
                        <td class="px-2 py-2" x-text="displayValue(recipe.glycemic_load)"></td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
            <button
              type="button"
              @click="toggleFavorite(recipe)"
              :aria-label="recipe.favorite ? t('removeFavorite') : t('addFavorite')"
              :aria-pressed="Boolean(recipe.favorite)"
              class="pointer-events-auto absolute right-4 top-4 z-20 rounded-lg bg-white/90 p-2 text-xl leading-none transition hover:bg-amber-50"
              :class="recipe.favorite ? 'text-amber-500' : 'text-slate-300 hover:text-amber-500'"
            >★</button>
          </article>
        </template>
      </section>

      <div x-show="!loading && !errorMessage && filteredRecipes.length === 0" class="rounded-2xl border border-dashed border-slate-300 bg-white px-6 py-14 text-center">
        <p class="text-lg font-semibold text-slate-800" x-text="recipes.length ? t('noMatches') : t('emptyTitle')"></p>
        <p class="mt-2 text-sm text-slate-500" x-text="recipes.length ? t('changeFilters') : t('emptyDescription')"></p>
        <button x-show="recipes.length === 0" type="button" @click="openForm()" class="mt-5 rounded-lg bg-slate-900 px-4 py-2 text-sm font-semibold text-white hover:bg-slate-700" x-text="t('newRecipe')"></button>
      </div>
    </main>

    <main x-show="selectedRecipe" x-cloak class="mx-auto max-w-4xl px-4 py-6 sm:px-6 sm:py-10">
      <article class="overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm">
        <div class="flex items-center justify-between border-b border-slate-200 px-5 py-3 sm:px-7">
          <button
            type="button"
            @click="closeRecipe()"
            class="inline-flex items-center gap-2 rounded-lg px-2 py-2 text-sm font-semibold text-slate-600 transition hover:bg-slate-100 hover:text-slate-900 focus:outline-none focus:ring-2 focus:ring-slate-400"
          >
            <span aria-hidden="true">←</span><span x-text="t('backToRecipes')"></span>
          </button>
        </div>
        <div class="p-5 sm:p-7">
          <img
            x-show="selectedRecipe && selectedRecipe.photo"
            :src="selectedRecipe && selectedRecipe.photo"
            :alt="selectedRecipe ? displayTitle(selectedRecipe) : ''"
            class="mb-6 max-h-[28rem] w-full rounded-xl object-cover"
          >
          <div class="mb-6">
            <span
              x-show="selectedRecipe && displayCategory(selectedRecipe)"
              class="inline-flex rounded-full bg-slate-100 px-3 py-1 text-xs font-semibold text-slate-700"
              x-text="selectedRecipe ? displayCategory(selectedRecipe) : ''"
            ></span>
            <h2 id="recipe-detail-title" class="mt-3 text-2xl font-bold tracking-tight text-slate-950 sm:text-3xl" x-text="selectedRecipe ? displayTitle(selectedRecipe) : ''"></h2>
          </div>

          <div class="mb-8 grid grid-cols-3 gap-2 sm:gap-3">
            <div class="rounded-xl border border-emerald-100 bg-emerald-50 p-3 sm:p-4">
              <p class="text-xs font-medium text-emerald-700" x-text="t('sj')"></p>
              <p class="mt-1 text-lg font-bold text-emerald-900" x-text="selectedRecipe ? displayValue(selectedRecipe.sj) : '—'"></p>
            </div>
            <div class="rounded-xl border border-blue-100 bg-blue-50 p-3 sm:p-4">
              <p class="text-xs font-medium text-blue-700" x-text="t('carbs')"></p>
              <p class="mt-1 text-lg font-bold text-blue-900" x-text="selectedRecipe ? displayMetric(selectedRecipe.carbs, 'g') : '—'"></p>
            </div>
            <div class="rounded-xl border p-3 sm:p-4" :class="selectedRecipe ? giClass(selectedRecipe.gi) : 'border-violet-100 bg-violet-50 text-violet-800'">
              <p class="text-xs font-medium opacity-80" x-text="t('gi')"></p>
              <p class="mt-1 text-lg font-bold" x-text="selectedRecipe ? displayValue(selectedRecipe.gi) : '—'"></p>
            </div>
          </div>

          <section class="mb-8" aria-labelledby="detail-nutrition-heading">
            <div class="mb-3 flex items-center justify-between">
              <h3 id="detail-nutrition-heading" class="text-lg font-semibold text-slate-900">Nutriční tabulka</h3>
              <span class="text-xs font-medium uppercase tracking-wide text-slate-500" x-text="selectedRecipe && selectedRecipe.servings ? `${selectedRecipe.servings} porcí` : 'Per porce'"></span>
            </div>
            <div class="overflow-x-auto rounded-xl border border-slate-200 bg-slate-50/50">
              <table class="min-w-[40rem] border-collapse text-left text-sm">
                <thead class="bg-slate-100 text-slate-700">
                  <tr>
                    <th class="px-3 py-2 font-semibold">SJ</th>
                    <th class="px-3 py-2 font-semibold" x-text="t('carbs')"></th>
                    <th class="px-3 py-2 font-semibold" x-text="t('fiber')"></th>
                    <th class="px-3 py-2 font-semibold" x-text="t('calories')"></th>
                    <th class="px-3 py-2 font-semibold" x-text="t('proteins')"></th>
                    <th class="px-3 py-2 font-semibold" x-text="t('fats')"></th>
                    <th class="px-3 py-2 font-semibold" x-text="t('salt')"></th>
                    <th class="px-3 py-2 font-semibold">GL</th>
                  </tr>
                </thead>
                <tbody class="bg-white text-slate-700">
                  <tr>
                    <td class="border-t border-slate-200 px-3 py-3" x-text="selectedRecipe ? displayValue(selectedRecipe.sj) : '—'"></td>
                    <td class="border-t border-slate-200 px-3 py-3" x-text="selectedRecipe ? displayMetric(selectedRecipe.carbs, 'g') : '—'"></td>
                    <td class="border-t border-slate-200 px-3 py-3" x-text="selectedRecipe ? displayMetric(selectedRecipe.fiber, 'g') : '—'"></td>
                    <td class="border-t border-slate-200 px-3 py-3" x-text="selectedRecipe ? displayMetric(selectedRecipe.calories, 'kcal') : '—'"></td>
                    <td class="border-t border-slate-200 px-3 py-3" x-text="selectedRecipe ? displayMetric(selectedRecipe.proteins, 'g') : '—'"></td>
                    <td class="border-t border-slate-200 px-3 py-3" x-text="selectedRecipe ? displayMetric(selectedRecipe.fats, 'g') : '—'"></td>
                    <td class="border-t border-slate-200 px-3 py-3" x-text="selectedRecipe ? displayMetric(selectedRecipe.salt, 'g') : '—'"></td>
                    <td class="border-t border-slate-200 px-3 py-3" x-text="selectedRecipe ? displayValue(selectedRecipe.glycemic_load) : '—'"></td>
                  </tr>
                </tbody>
              </table>
            </div>
          </section>

          <section class="mb-8" aria-labelledby="detail-ingredients-heading">
            <h3 id="detail-ingredients-heading" class="mb-3 text-lg font-semibold text-slate-900" x-text="t('ingredients')"></h3>
            <ul x-show="selectedRecipe && recipeIngredients(selectedRecipe).length" class="divide-y divide-slate-100 rounded-xl border border-slate-200">
              <template x-for="(ingredient, index) in selectedRecipe ? recipeIngredients(selectedRecipe) : []" :key="index">
                <li class="grid grid-cols-[minmax(0,1fr)_auto] items-center gap-4 px-4 py-3 text-sm">
                  <span class="font-medium text-slate-800" x-text="ingredient.name || ''"></span>
                  <span class="text-right text-slate-500" x-text="ingredientMeasure(ingredient)"></span>
                </li>
              </template>
            </ul>
            <p x-show="selectedRecipe && !recipeIngredients(selectedRecipe).length" class="rounded-xl border border-dashed border-slate-200 px-4 py-5 text-sm text-slate-500" x-text="t('noIngredients')"></p>
          </section>

          <section class="mb-8" aria-labelledby="detail-steps-heading">
            <h3 id="detail-steps-heading" class="mb-3 text-lg font-semibold text-slate-900" x-text="t('steps')"></h3>
            <ol x-show="selectedRecipe && recipeSteps(selectedRecipe).length" class="space-y-3">
              <template x-for="(step, index) in selectedRecipe ? recipeSteps(selectedRecipe) : []" :key="index">
                <li class="flex gap-3 rounded-xl border border-slate-200 bg-white p-4 text-sm leading-relaxed text-slate-700">
                  <span class="grid h-7 w-7 shrink-0 place-items-center rounded-full bg-slate-100 text-xs font-bold text-slate-700" x-text="index + 1"></span>
                  <span x-text="step"></span>
                </li>
              </template>
            </ol>
            <p x-show="selectedRecipe && !recipeSteps(selectedRecipe).length" class="rounded-xl border border-dashed border-slate-200 px-4 py-5 text-sm text-slate-500" x-text="t('noSteps')"></p>
          </section>

          <section
            x-show="selectedRecipe && selectedRecipe.notes"
            class="rounded-xl border border-amber-100 bg-amber-50/70 p-4"
            aria-labelledby="detail-notes-heading"
          >
            <h3 id="detail-notes-heading" class="mb-1 text-sm font-semibold text-amber-900" x-text="t('notes')"></h3>
            <p class="whitespace-pre-line text-sm leading-relaxed text-amber-900/80" x-text="selectedRecipe ? selectedRecipe.notes : ''"></p>
          </section>
        </div>
      </article>
    </main>

    <div
      x-show="showForm"
      x-cloak
      x-transition.opacity
      @keydown.escape.window="closeForm()"
      @click.self="closeForm()"
      class="fixed inset-0 z-50 flex items-end justify-center bg-slate-950/50 p-0 backdrop-blur-sm sm:items-center sm:p-4"
      role="dialog"
      aria-modal="true"
      aria-labelledby="dialog-title"
    >
      <section x-transition class="max-h-[95vh] w-full overflow-y-auto rounded-t-2xl bg-white p-5 shadow-2xl sm:max-w-xl sm:rounded-2xl sm:p-7">
        <div class="mb-6 flex items-start justify-between gap-4">
          <div>
            <p class="text-sm font-medium text-slate-500" x-text="t('dialogEyebrow')"></p>
            <h2 id="dialog-title" class="mt-1 text-2xl font-bold tracking-tight" x-text="t('addRecipeTitle')"></h2>
          </div>
          <button type="button" @click="closeForm()" :aria-label="t('close')" class="rounded-lg p-2 text-slate-500 hover:bg-slate-100 hover:text-slate-900">✕</button>
        </div>
        <form @submit.prevent="addRecipe()" class="space-y-4">
          <div class="grid gap-4 sm:grid-cols-2">
            <label class="block text-sm font-medium text-slate-700">
              <span x-text="t('recipeNameCs')"></span>
              <input type="text" x-model.trim="newRecipe.title_cs" required maxlength="160" class="mt-1.5 w-full rounded-lg border border-slate-200 px-3 py-2.5 outline-none focus:border-slate-400 focus:ring-2 focus:ring-slate-100">
            </label>
            <label class="block text-sm font-medium text-slate-700">
              <span x-text="t('recipeNameSk')"></span>
              <input type="text" x-model.trim="newRecipe.title_sk" maxlength="160" class="mt-1.5 w-full rounded-lg border border-slate-200 px-3 py-2.5 outline-none focus:border-slate-400 focus:ring-2 focus:ring-slate-100">
            </label>
            <label class="block text-sm font-medium text-slate-700">
              <span x-text="t('categoryCs')"></span>
              <input type="text" x-model.trim="newRecipe.category_cs" required maxlength="80" class="mt-1.5 w-full rounded-lg border border-slate-200 px-3 py-2.5 outline-none focus:border-slate-400 focus:ring-2 focus:ring-slate-100">
            </label>
            <label class="block text-sm font-medium text-slate-700">
              <span x-text="t('categorySk')"></span>
              <input type="text" x-model.trim="newRecipe.category_sk" maxlength="80" class="mt-1.5 w-full rounded-lg border border-slate-200 px-3 py-2.5 outline-none focus:border-slate-400 focus:ring-2 focus:ring-slate-100">
            </label>
          </div>
          <div class="grid gap-4 sm:grid-cols-3">
            <label class="block text-sm font-medium text-slate-700">
              <span x-text="t('servings')"></span>
              <input type="number" x-model.number="newRecipe.servings" min="1" step="1" class="mt-1.5 w-full rounded-lg border border-slate-200 px-3 py-2.5 outline-none focus:border-slate-400 focus:ring-2 focus:ring-slate-100">
            </label>
            <label class="block text-sm font-medium text-slate-700">
              <span x-text="t('sj')"></span>
              <input type="number" x-model.number="newRecipe.sj" min="0" step="0.1" class="mt-1.5 w-full rounded-lg border border-slate-200 px-3 py-2.5 outline-none focus:border-slate-400 focus:ring-2 focus:ring-slate-100">
            </label>
            <label class="block text-sm font-medium text-slate-700">
              <span x-text="t('carbs')"></span>
              <input type="number" x-model.number="newRecipe.carbs" min="0" step="0.1" class="mt-1.5 w-full rounded-lg border border-slate-200 px-3 py-2.5 outline-none focus:border-slate-400 focus:ring-2 focus:ring-slate-100">
            </label>
            <label class="block text-sm font-medium text-slate-700">
              <span x-text="t('gi')"></span>
              <input type="text" x-model.trim="newRecipe.gi" maxlength="40" class="mt-1.5 w-full rounded-lg border border-slate-200 px-3 py-2.5 outline-none focus:border-slate-400 focus:ring-2 focus:ring-slate-100">
            </label>
            <label class="block text-sm font-medium text-slate-700">
              <span x-text="t('glycemicLoad')"></span>
              <input type="number" x-model.number="newRecipe.glycemic_load" min="0" step="0.1" class="mt-1.5 w-full rounded-lg border border-slate-200 px-3 py-2.5 outline-none focus:border-slate-400 focus:ring-2 focus:ring-slate-100">
            </label>
          </div>
          <section class="rounded-xl border border-slate-200 bg-slate-50/70 p-4" aria-labelledby="ingredients-heading">
            <div class="mb-3 flex items-center justify-between gap-3">
              <h3 id="ingredients-heading" class="text-sm font-semibold text-slate-800" x-text="t('ingredients')"></h3>
              <button
                type="button"
                @click="newRecipe.ingredients.push({ name: '', amount: '', unit: '' })"
                class="rounded-lg border border-slate-200 bg-white px-3 py-1.5 text-sm font-semibold text-slate-700 transition hover:bg-slate-100"
                x-text="t('addIngredient')"
              ></button>
            </div>
            <div class="space-y-3">
              <template x-for="(ingredient, index) in newRecipe.ingredients" :key="index">
                <div class="grid gap-2 sm:grid-cols-[minmax(0,1fr)_minmax(0,0.65fr)_minmax(0,0.65fr)_auto] sm:items-end">
                  <label class="block text-xs font-medium text-slate-600">
                    <span x-text="t('ingredientName')"></span>
                    <input type="text" x-model.trim="ingredient.name" maxlength="120" class="mt-1 w-full rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm text-slate-900 outline-none focus:border-slate-400 focus:ring-2 focus:ring-slate-100">
                  </label>
                  <label class="block text-xs font-medium text-slate-600">
                    <span x-text="t('amount')"></span>
                    <input type="text" x-model.trim="ingredient.amount" maxlength="40" class="mt-1 w-full rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm text-slate-900 outline-none focus:border-slate-400 focus:ring-2 focus:ring-slate-100">
                  </label>
                  <label class="block text-xs font-medium text-slate-600">
                    <span x-text="t('unit')"></span>
                    <input type="text" x-model.trim="ingredient.unit" maxlength="40" class="mt-1 w-full rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm text-slate-900 outline-none focus:border-slate-400 focus:ring-2 focus:ring-slate-100">
                  </label>
                  <button
                    type="button"
                    @click="newRecipe.ingredients.splice(index, 1)"
                    :aria-label="t('removeIngredient')"
                    class="rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm font-semibold text-slate-500 transition hover:border-red-200 hover:bg-red-50 hover:text-red-700"
                  >×</button>
                </div>
              </template>
            </div>
          </section>
          <section class="rounded-xl border border-slate-200 bg-slate-50/70 p-4" aria-labelledby="steps-heading">
            <div class="mb-3 flex items-center justify-between gap-3">
              <h3 id="steps-heading" class="text-sm font-semibold text-slate-800" x-text="t('steps')"></h3>
              <button
                type="button"
                @click="newRecipe.steps.push('')"
                class="rounded-lg border border-slate-200 bg-white px-3 py-1.5 text-sm font-semibold text-slate-700 transition hover:bg-slate-100"
                x-text="t('addStep')"
              ></button>
            </div>
            <div class="space-y-2">
              <template x-for="(step, index) in newRecipe.steps" :key="index">
                <div class="flex items-start gap-2">
                  <label class="min-w-0 flex-1 text-xs font-medium text-slate-600">
                    <span><span x-text="t('step')"></span> <span x-text="index + 1"></span></span>
                    <textarea x-model.trim="newRecipe.steps[index]" rows="2" maxlength="1000" class="mt-1 w-full resize-y rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm text-slate-900 outline-none focus:border-slate-400 focus:ring-2 focus:ring-slate-100"></textarea>
                  </label>
                  <button
                    type="button"
                    @click="newRecipe.steps.splice(index, 1)"
                    :aria-label="t('removeStep')"
                    class="mt-5 rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm font-semibold text-slate-500 transition hover:border-red-200 hover:bg-red-50 hover:text-red-700"
                  >×</button>
                </div>
              </template>
            </div>
          </section>
          <label class="block text-sm font-medium text-slate-700">
            <span x-text="t('notes')"></span>
            <textarea x-model.trim="newRecipe.notes" rows="3" maxlength="2000" :placeholder="t('notesPlaceholder')" class="mt-1.5 w-full resize-y rounded-lg border border-slate-200 px-3 py-2.5 outline-none placeholder:text-slate-400 focus:border-slate-400 focus:ring-2 focus:ring-slate-100"></textarea>
          </label>
          <label class="block text-sm font-medium text-slate-700">
            <span x-text="t('photoUrl')"></span>
            <input type="url" x-model.trim="newRecipe.photo" maxlength="2048" class="mt-1.5 w-full rounded-lg border border-slate-200 px-3 py-2.5 outline-none focus:border-slate-400 focus:ring-2 focus:ring-slate-100">
          </label>
          <section class="rounded-xl border border-slate-200 bg-slate-50/70 p-4" aria-labelledby="nutrition-heading">
            <h3 id="nutrition-heading" class="mb-3 text-sm font-semibold text-slate-800">Nutriční hodnoty</h3>
            <div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
              <label class="block text-xs font-medium text-slate-600">
                <span x-text="t('fiber')"></span>
                <input type="number" x-model.number="newRecipe.fiber" min="0" step="0.1" class="mt-1 w-full rounded-lg border border-slate-200 bg-white px-3 py-2.5 text-sm text-slate-900 outline-none focus:border-slate-400 focus:ring-2 focus:ring-slate-100">
              </label>
              <label class="block text-xs font-medium text-slate-600">
                <span x-text="t('calories')"></span>
                <input type="number" x-model.number="newRecipe.calories" min="0" step="1" class="mt-1 w-full rounded-lg border border-slate-200 bg-white px-3 py-2.5 text-sm text-slate-900 outline-none focus:border-slate-400 focus:ring-2 focus:ring-slate-100">
              </label>
              <label class="block text-xs font-medium text-slate-600">
                <span x-text="t('proteins')"></span>
                <input type="number" x-model.number="newRecipe.proteins" min="0" step="0.1" class="mt-1 w-full rounded-lg border border-slate-200 bg-white px-3 py-2.5 text-sm text-slate-900 outline-none focus:border-slate-400 focus:ring-2 focus:ring-slate-100">
              </label>
              <label class="block text-xs font-medium text-slate-600">
                <span x-text="t('fats')"></span>
                <input type="number" x-model.number="newRecipe.fats" min="0" step="0.1" class="mt-1 w-full rounded-lg border border-slate-200 bg-white px-3 py-2.5 text-sm text-slate-900 outline-none focus:border-slate-400 focus:ring-2 focus:ring-slate-100">
              </label>
              <label class="block text-xs font-medium text-slate-600">
                <span x-text="t('salt')"></span>
                <input type="number" x-model.number="newRecipe.salt" min="0" step="0.1" class="mt-1 w-full rounded-lg border border-slate-200 bg-white px-3 py-2.5 text-sm text-slate-900 outline-none focus:border-slate-400 focus:ring-2 focus:ring-slate-100">
              </label>
            </div>
          </section>
          <p x-show="formError" x-cloak class="rounded-lg bg-red-50 p-3 text-sm text-red-700" role="alert" x-text="formError"></p>
          <div class="flex flex-col-reverse gap-2 pt-2 sm:flex-row sm:justify-end">
            <button type="button" @click="closeForm()" class="rounded-lg border border-slate-200 px-4 py-2.5 text-sm font-semibold text-slate-700 hover:bg-slate-50" x-text="t('cancel')"></button>
            <button type="submit" :disabled="saving" class="rounded-lg bg-slate-900 px-5 py-2.5 text-sm font-semibold text-white hover:bg-slate-700 disabled:cursor-not-allowed disabled:opacity-60" x-text="saving ? t('saving') : t('saveRecipe')"></button>
          </div>
        </form>
      </section>
    </div>

    <footer class="border-t border-slate-200 bg-white py-5 text-center text-xs text-slate-500">
      hamMňam <span aria-hidden="true">·</span> <span x-text="t('footer')"></span>
    </footer>
    <style>[x-cloak] { display: none !important; }</style>
  </body>
</html>
