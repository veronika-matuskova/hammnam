<!doctype html>
<html lang="sk">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#134e4a">
    <meta name="description" content="Spravujte recepty a ich nutričné hodnoty.">
    <title>hamMňam — recepty s prehľadom</title>
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" href="./icons/app-icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="./icons/app-icon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="./js/theme.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500..800&family=Nunito:wght@400..900&display=swap">
    <link rel="stylesheet" href="./css/theme.css">
    <script defer src="./config.js"></script>
    <script defer src="./js/app.js?v=21"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  </head>
  <body
    class="min-h-screen bg-slate-50 font-sans text-slate-900 antialiased"
    x-data="recipeApp"
    x-effect="document.documentElement.lang = language"
  >
    <header class="sticky top-0 z-40 border-b-2 border-slate-200 bg-white/90 backdrop-blur">
      <div class="mx-auto flex max-w-6xl items-center justify-between gap-3 px-4 py-3 sm:px-6">
        <a href="./" class="flex min-w-0 items-center gap-2.5" aria-label="hamMňam — domov">
          <img src="./icons/mascots/cookbook-96.png" alt="" width="44" height="44" class="mascot h-11 w-11 shrink-0 -my-1">
          <span class="min-w-0" :class="isSignedIn ? 'hidden sm:block' : ''">
            <span class="font-display block truncate text-xl font-semibold leading-tight text-slate-900">ham<span class="text-emerald-600">Mňam</span></span>
            <span class="hidden truncate text-xs text-slate-500 sm:block" x-text="t('tagline')"></span>
          </span>
        </a>
        <!-- Header icons: Phosphor Icons duotone (MIT), https://phosphoricons.com -->
        <nav class="flex shrink-0 items-start gap-0.5 sm:gap-1.5" :aria-label="t('headerNav')">
          <a
            href="./learn.html"
            class="inline-flex min-w-[3rem] flex-col items-center justify-center gap-0.5 rounded-xl px-1.5 py-1 text-[11px] font-bold leading-none transition focus:outline-none focus:ring-2 focus:ring-slate-400 text-slate-700 hover:bg-slate-100"
            :aria-label="t('learnLinkLabel')"
            :title="t('learnLinkLabel')"
          >
            <svg class="h-7 w-7 shrink-0 text-amber-600" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M208,104a79.86,79.86,0,0,1-30.59,62.92A24.29,24.29,0,0,0,168,186v6a8,8,0,0,1-8,8H96a8,8,0,0,1-8-8v-6a24.11,24.11,0,0,0-9.3-19A79.87,79.87,0,0,1,48,104.45C47.76,61.09,82.72,25,126.07,24A80,80,0,0,1,208,104Z" opacity="0.2"/><path d="M176,232a8,8,0,0,1-8,8H88a8,8,0,0,1,0-16h80A8,8,0,0,1,176,232Zm40-128a87.55,87.55,0,0,1-33.64,69.21A16.24,16.24,0,0,0,176,186v6a16,16,0,0,1-16,16H96a16,16,0,0,1-16-16v-6a16,16,0,0,0-6.23-12.66A87.59,87.59,0,0,1,40,104.49C39.74,56.83,78.26,17.14,125.88,16A88,88,0,0,1,216,104Zm-16,0a72,72,0,0,0-73.74-72c-39,.92-70.47,33.39-70.26,72.39a71.65,71.65,0,0,0,27.64,56.3A32,32,0,0,1,96,186v6h64v-6a32.15,32.15,0,0,1,12.47-25.35A71.65,71.65,0,0,0,200,104Zm-16.11-9.34a57.6,57.6,0,0,0-46.56-46.55,8,8,0,0,0-2.66,15.78c16.57,2.79,30.63,16.85,33.44,33.45A8,8,0,0,0,176,104a9,9,0,0,0,1.35-.11A8,8,0,0,0,183.89,94.66Z"/></svg>
            <span class="whitespace-nowrap" x-text="t('learnLink')"></span>
          </a>
          <button
            x-show="canSwitchLanguage"
            type="button"
            @click="toggleLanguage()"
            class="self-stretch text-sm inline-flex min-w-[3rem] flex-col items-center justify-center gap-0.5 rounded-xl px-1.5 py-1 text-[11px] font-bold leading-none transition focus:outline-none focus:ring-2 focus:ring-slate-400 text-slate-700 hover:bg-slate-100"
            :aria-label="t('switchLanguage')"
            x-text="language.toUpperCase()"
          ></button>
          <button
            x-show="!isSignedIn"
            type="button"
            @click="openSignIn()"
            class="inline-flex min-w-[3rem] flex-col items-center justify-center gap-0.5 rounded-xl px-1.5 py-1 text-[11px] font-bold leading-none transition focus:outline-none focus:ring-2 focus:ring-slate-400 text-slate-700 hover:bg-slate-100"
            :aria-label="t('signIn')"
            :title="t('signIn')"
          >
            <svg class="h-7 w-7 shrink-0 text-slate-900" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M224,128a95.76,95.76,0,0,1-31.8,71.37A72,72,0,0,0,128,160a40,40,0,1,0-40-40,40,40,0,0,0,40,40,72,72,0,0,0-64.2,39.37h0A96,96,0,1,1,224,128Z" opacity="0.2"/><path d="M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24ZM74.08,197.5a64,64,0,0,1,107.84,0,87.83,87.83,0,0,1-107.84,0ZM96,120a32,32,0,1,1,32,32A32,32,0,0,1,96,120Zm97.76,66.41a79.66,79.66,0,0,0-36.06-28.75,48,48,0,1,0-59.4,0,79.66,79.66,0,0,0-36.06,28.75,88,88,0,1,1,131.52,0Z"/></svg>
            <span class="whitespace-nowrap" x-text="t('signIn')"></span>
          </button>
          <button
            x-show="canUseShoppingList"
            x-cloak
            type="button"
            @click="showShoppingList ? closeShoppingList() : openShoppingList()"
            class="relative inline-flex min-w-[3rem] flex-col items-center justify-center gap-0.5 rounded-xl px-1.5 py-1 text-[11px] font-bold leading-none transition focus:outline-none focus:ring-2 focus:ring-slate-400"
            :class="showShoppingList ? 'bg-emerald-100 text-emerald-900' : 'text-slate-700 hover:bg-slate-100'"
            :aria-label="shoppingRemainingCount ? `${t('shoppingList')} – ${tf('shoppingRemaining', { count: shoppingRemainingCount })}` : t('shoppingList')"
            :aria-pressed="showShoppingList ? 'true' : 'false'"
            :title="t('shoppingList')"
          >
            <svg class="h-7 w-7 shrink-0 text-red-600" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M232,88,216.93,201.06A8,8,0,0,1,209,208H47a8,8,0,0,1-7.93-6.94L24,88Z" opacity="0.2"/><path d="M136,120v56a8,8,0,0,1-16,0V120a8,8,0,0,1,16,0Zm36.84-.8-5.6,56A8,8,0,0,0,174.4,184a7.32,7.32,0,0,0,.81,0,8,8,0,0,0,7.95-7.2l5.6-56a8,8,0,0,0-15.92-1.6Zm-89.68,0a8,8,0,0,0-15.92,1.6l5.6,56a8,8,0,0,0,8,7.2,7.32,7.32,0,0,0,.81,0,8,8,0,0,0,7.16-8.76ZM239.93,89.06,224.86,202.12A16.06,16.06,0,0,1,209,216H47a16.06,16.06,0,0,1-15.86-13.88L16.07,89.06A8,8,0,0,1,24,80H68.37L122,18.73a8,8,0,0,1,12,0L187.63,80H232a8,8,0,0,1,7.93,9.06ZM89.63,80h76.74L128,36.15ZM222.86,96H33.14L47,200H209Z"/></svg>
            <span
              x-show="shoppingRemainingCount"
              class="absolute -right-0.5 -top-1 grid h-[1.125rem] min-w-[1.125rem] place-items-center rounded-full bg-red-600 px-1 text-[10px] font-bold leading-none text-white ring-2 ring-white"
              aria-hidden="true"
              x-text="shoppingRemainingCount > 99 ? '99+' : shoppingRemainingCount"
            ></span>
            <span class="whitespace-nowrap" x-text="t('shoppingNav')"></span>
          </button>
          <button
            x-show="canEdit"
            x-cloak
            type="button"
            @click="showHistory ? closeHistory() : openHistory()"
            class="relative inline-flex min-w-[3rem] flex-col items-center justify-center gap-0.5 rounded-xl px-1.5 py-1 text-[11px] font-bold leading-none transition focus:outline-none focus:ring-2 focus:ring-slate-400"
            :class="showHistory ? 'bg-amber-100 text-amber-900' : 'text-slate-700 hover:bg-slate-100'"
            :aria-label="t('historyNav')"
            :aria-pressed="showHistory ? 'true' : 'false'"
            :title="t('historyNav')"
          >
            <svg class="h-7 w-7 shrink-0 text-emerald-600" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M216,80V184a24,24,0,0,1-24,24H64a24,24,0,0,1-24-24V80Z" opacity="0.2"/><path d="M88,48V16a8,8,0,0,1,16,0V48a8,8,0,0,1-16,0Zm40,8a8,8,0,0,0,8-8V16a8,8,0,0,0-16,0V48A8,8,0,0,0,128,56Zm32,0a8,8,0,0,0,8-8V16a8,8,0,0,0-16,0V48A8,8,0,0,0,160,56Zm92.8,46.4L224,124v60a32,32,0,0,1-32,32H64a32,32,0,0,1-32-32V124L3.2,102.4a8,8,0,0,1,9.6-12.8L32,104V80a8,8,0,0,1,8-8H216a8,8,0,0,1,8,8v24l19.2-14.4a8,8,0,0,1,9.6,12.8ZM208,88H48v96a16,16,0,0,0,16,16H192a16,16,0,0,0,16-16Z"/></svg>
            <span class="whitespace-nowrap" x-text="t('historyNav')"></span>
          </button>
          <button
            x-show="canEdit && !selectedRecipe && !showForm && !showShoppingList && !showHistory"
            x-cloak
            type="button"
            @click="openForm()"
            class="inline-flex min-w-[3rem] flex-col items-center justify-center gap-0.5 rounded-xl px-1.5 py-1 text-[11px] font-bold leading-none transition focus:outline-none focus:ring-2 focus:ring-slate-400 text-slate-700 hover:bg-slate-100"
            :aria-label="t('newRecipeLabel')"
            :title="t('newRecipeLabel')"
          >
            <svg class="h-7 w-7 shrink-0 text-emerald-600" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M232,112a48,48,0,0,1-48,48H72A48,48,0,1,1,82.35,65.12h0a48,48,0,0,1,91.28,0h0A48,48,0,0,1,232,112Z" opacity="0.2"/><path d="M240,112a56.06,56.06,0,0,0-56-56c-1.77,0-3.54.1-5.29.26a56,56,0,0,0-101.42,0C75.54,56.1,73.77,56,72,56A56,56,0,0,0,48,162.59V208a16,16,0,0,0,16,16H192a16,16,0,0,0,16-16V162.59A56.09,56.09,0,0,0,240,112Zm-48,96H64V167.42a55.49,55.49,0,0,0,8,.58H184a55.49,55.49,0,0,0,8-.58Zm-8-56H170.25l5.51-22.06a8,8,0,0,0-15.52-3.88L153.75,152H136V128a8,8,0,0,0-16,0v24H102.25l-6.49-25.94a8,8,0,1,0-15.52,3.88L85.75,152H72a40,40,0,0,1,0-80l.58,0A55.21,55.21,0,0,0,72,80a8,8,0,0,0,16,0,40,40,0,0,1,80,0,8,8,0,0,0,16,0,55.21,55.21,0,0,0-.58-8l.58,0a40,40,0,0,1,0,80Z"/></svg>
            <span class="whitespace-nowrap" x-text="t('newRecipeNav')"></span>
          </button>
          <button
            x-show="isSignedIn"
            x-cloak
            type="button"
            @click="signOut()"
            class="inline-flex min-w-[3rem] flex-col items-center justify-center gap-0.5 rounded-xl px-1.5 py-1 text-[11px] font-bold leading-none transition focus:outline-none focus:ring-2 focus:ring-slate-400 text-slate-700 hover:bg-slate-100"
            :aria-label="t('signOut')"
            :title="signedInEmail ? `${t('signOut')} (${signedInEmail})` : t('signOut')"
          >
            <svg class="h-7 w-7 shrink-0 text-slate-900" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M224,56V200a16,16,0,0,1-16,16H48V40H208A16,16,0,0,1,224,56Z" opacity="0.2"/><path d="M120,216a8,8,0,0,1-8,8H48a8,8,0,0,1-8-8V40a8,8,0,0,1,8-8h64a8,8,0,0,1,0,16H56V208h56A8,8,0,0,1,120,216Zm109.66-93.66-40-40a8,8,0,0,0-11.32,11.32L204.69,120H112a8,8,0,0,0,0,16h92.69l-26.35,26.34a8,8,0,0,0,11.32,11.32l40-40A8,8,0,0,0,229.66,122.34Z"/></svg>
            <span class="whitespace-nowrap" x-text="t('signOut')"></span>
          </button>
        </nav>
      </div>
    </header>

    <section x-show="!isSignedIn && (showSignIn || showForm || showShoppingList || showHistory)" x-cloak class="mx-auto mt-6 max-w-md px-4 sm:px-6" aria-labelledby="sign-in-title">
      <div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
        <div class="flex items-start justify-between gap-3">
          <h2 id="sign-in-title" class="text-lg font-semibold text-slate-900" x-text="t('signInTitle')"></h2>
          <button x-show="!showForm && !showShoppingList && !showHistory" type="button" @click="showSignIn = false; authError = ''" :aria-label="t('close')" class="shrink-0 text-lg font-semibold leading-none text-slate-500">&times;</button>
        </div>
        <p class="mt-1 text-sm text-slate-600" x-text="showShoppingList ? t('shoppingSignInNote') : showHistory ? t('historySignInNote') : showForm ? t('signInToEdit') : t('signInIntro')"></p>
        <form @submit.prevent="requestMagicLink()" class="mt-4 flex flex-col gap-2 sm:flex-row">
          <label class="min-w-0 flex-1">
            <span class="sr-only" x-text="t('email')"></span>
            <input type="email" x-model.trim="signInEmail" required autocomplete="email" :placeholder="t('email')" class="w-full rounded-lg border border-slate-200 px-3 py-2.5 text-sm outline-none focus:border-slate-400 focus:ring-2 focus:ring-slate-100">
          </label>
          <button type="submit" :disabled="authSending" class="rounded-lg bg-slate-900 px-4 py-2.5 text-sm font-semibold text-white hover:bg-slate-700 disabled:cursor-wait disabled:opacity-60" x-text="authSending ? t('sendingMagicLink') : t('sendMagicLink')"></button>
        </form>
        <p x-show="magicLinkSent" class="mt-3 rounded-lg bg-emerald-50 p-3 text-sm text-emerald-800" role="status" x-text="t('magicLinkSent')"></p>
        <p x-show="authError" class="mt-3 rounded-lg bg-red-50 p-3 text-sm text-red-700" role="alert" x-text="authError"></p>
        <button x-show="showForm || showShoppingList || showHistory" type="button" @click="showForm ? closeForm() : showHistory ? closeHistory() : closeShoppingList()" class="mt-4 text-sm font-semibold text-slate-600 hover:text-slate-950" x-text="t('backToRecipes')"></button>
      </div>
    </section>
    <p x-show="isSignedIn && familyMember === false" x-cloak class="mx-auto mt-4 max-w-6xl px-4 text-sm text-amber-800 sm:px-6" role="status" x-text="t('notFamilyMember')"></p>

    <main x-show="!selectedRecipe && !showForm && !showShoppingList && !showHistory" class="mx-auto max-w-6xl px-4 py-8 sm:px-6 sm:py-10">
      <section class="relative mb-8 overflow-hidden rounded-2xl border-2 border-slate-200 bg-gradient-to-br from-amber-100 via-white to-emerald-50 p-5 shadow-md sm:p-8">
        <div aria-hidden="true" class="pointer-events-none absolute -right-10 -top-10 h-40 w-40 rounded-full bg-red-100/70"></div>
        <div aria-hidden="true" class="pointer-events-none absolute -bottom-12 left-1/3 h-32 w-32 rounded-full bg-emerald-100/70"></div>
        <div class="relative flex items-center gap-3 sm:gap-8">
        <div class="min-w-0 flex-1">
          <p class="mb-2 inline-flex rounded-full bg-white px-3 py-1 text-xs font-extrabold uppercase tracking-widest text-red-600 shadow-sm" x-text="t('eyebrow')"></p>
          <h1 class="text-3xl font-bold text-slate-950 sm:text-5xl" x-text="t('heading')"></h1>
          <p class="mt-2 max-w-2xl text-slate-600" x-text="t('intro')"></p>
          <div class="mt-5 flex flex-wrap items-center gap-3">
            <button
              type="button"
              @click="toggleSuggestion()"
              :disabled="loading || recipes.length === 0"
              :aria-expanded="showSuggestion"
              aria-controls="suggestion-panel"
              class="inline-flex items-center gap-2 rounded-full border-2 border-emerald-500 bg-emerald-400 px-4 py-2.5 text-sm font-extrabold text-emerald-950 shadow-md transition hover:bg-emerald-300 focus:outline-none focus:ring-2 focus:ring-emerald-300 disabled:cursor-not-allowed disabled:opacity-50"
            >
              <span aria-hidden="true" class="text-lg leading-none">🎲</span>
              <span x-text="t('suggestTitle')"></span>
            </button>
            <p class="rounded-full bg-white/80 px-3 py-1 text-sm font-semibold text-slate-600" aria-live="polite">
              <span x-text="recipeCountLabel(filteredRecipes.length)"></span>
            </p>
          </div>
        </div>
        <img src="./icons/mascots/cookbook-384.png" alt="" width="176" height="176" class="mascot mascot-hero h-24 w-24 shrink-0 self-start motion-safe:animate-bob sm:h-44 sm:w-44 sm:self-center">
        </div>
      </section>

      <section id="suggestion-panel" x-show="showSuggestion" x-cloak class="mb-6 rounded-2xl border border-emerald-200 bg-emerald-50/60 p-4 shadow-sm sm:p-5" aria-labelledby="suggestion-title">
        <div class="flex items-start justify-between gap-3">
          <div>
            <h2 id="suggestion-title" class="text-lg font-semibold text-slate-900" x-text="t('suggestTitle')"></h2>
            <p class="mt-1 text-sm text-slate-600" x-text="t('suggestIntro')"></p>
          </div>
          <button type="button" @click="showSuggestion = false" :aria-label="t('close')" class="shrink-0 text-lg font-semibold leading-none text-slate-500">&times;</button>
        </div>
        <div class="mt-4 grid gap-3 sm:grid-cols-2 lg:grid-cols-4">
          <label>
            <span class="sr-only" x-text="t('category')"></span>
            <select x-model="suggestionFilters.category" @change="suggestRecipe()" class="w-full rounded-lg border border-slate-200 bg-white px-3 py-2.5 text-sm text-slate-700 outline-none focus:border-slate-400 focus:ring-2 focus:ring-slate-100">
              <option value="" x-text="t('allCategories')"></option>
              <template x-for="category in categories" :key="category">
                <option :value="category" x-text="category"></option>
              </template>
            </select>
          </label>
          <label class="flex items-center gap-2 rounded-lg border border-slate-200 bg-white px-3 py-2.5 text-sm text-slate-700">
            <input type="checkbox" x-model="suggestionFilters.favoritesOnly" @change="suggestRecipe()" class="h-4 w-4 rounded border-slate-300">
            <span x-text="t('suggestFavoritesOnly')"></span>
          </label>
          <label class="flex items-center gap-2 rounded-lg border border-slate-200 bg-white px-3 py-2.5 text-sm text-slate-700">
            <input type="checkbox" x-model="suggestionFilters.lowGi" @change="suggestRecipe()" class="h-4 w-4 rounded border-slate-300">
            <span x-text="t('suggestLowGi')"></span>
          </label>
          <label>
            <span class="sr-only" x-text="t('suggestMaxSj')"></span>
            <input
              type="text"
              inputmode="decimal"
              x-model="suggestionFilters.maxSj"
              @change="suggestRecipe()"
              :placeholder="t('suggestMaxSj')"
              :aria-invalid="suggestionMaxSjInvalid"
              class="w-full rounded-lg border bg-white px-3 py-2.5 text-sm outline-none placeholder:text-slate-400 focus:ring-2 focus:ring-slate-100"
              :class="suggestionMaxSjInvalid ? 'border-red-300' : 'border-slate-200 focus:border-slate-400'"
            >
          </label>
        </div>
        <p x-show="suggestionMaxSjInvalid" class="mt-2 text-xs text-red-700" x-text="t('suggestMaxSjInvalid')"></p>
        <p x-show="suggestionMaxSj !== null" class="mt-2 text-xs text-slate-500" x-text="t('suggestMaxSjHint')"></p>

        <template x-if="suggestedRecipe">
          <div class="mt-4 flex flex-col gap-4 rounded-xl border border-slate-200 bg-white p-4 sm:flex-row sm:items-center" aria-live="polite">
            <img x-show="suggestedRecipe.photo" :src="suggestedRecipe.photo" :alt="displayTitle(suggestedRecipe)" class="h-28 w-full rounded-lg object-cover sm:w-40">
            <div class="min-w-0 flex-1">
              <p class="mb-1 text-xs font-medium uppercase tracking-wide text-slate-500" x-text="displayCategory(suggestedRecipe)"></p>
              <p class="text-lg font-semibold leading-snug text-slate-900" x-text="displayTitle(suggestedRecipe)"></p>
              <div class="mt-3 flex flex-wrap gap-2">
                <span x-show="recipePortionSj(suggestedRecipe) !== null" class="inline-flex items-center gap-1.5 rounded-full bg-emerald-100 px-3 py-1.5 text-xs font-semibold text-emerald-900">

                    @click="changeIngredientServings(selectedRecipe, 1)"
                    :disabled="!selectedRecipe || ingredientServings(selectedRecipe) >= 99"
                    class="h-9 w-9 rounded-r-lg text-lg font-semibold text-slate-700 transition hover:bg-slate-100 disabled:cursor-not-allowed disabled:opacity-40"

                </div>
                <span x-text="t('scaleServingsUnit')"></span>
              </div>
            </div>
            <p x-show="selectedRecipe && isIngredientScaled(selectedRecipe)" class="mb-3 flex flex-wrap items-center gap-x-3 gap-y-1 text-xs text-slate-500">
              <span x-text="selectedRecipe ? tf('scaledFrom', { servings: formatNumber(recipeBaseServings(selectedRecipe)) }) : ''"></span>
              <button type="button" @click="resetIngredientServings()" class="font-semibold text-slate-700 underline underline-offset-2 hover:text-slate-900" x-text="t('resetServings')"></button>

            <ul x-show="selectedRecipe && recipeIngredients(selectedRecipe).length" class="divide-y divide-slate-100 rounded-xl border border-slate-200">
              <template x-for="(ingredient, index) in selectedRecipe ? recipeIngredients(selectedRecipe) : []" :key="index">

                @click="addRecipeToShoppingList(selectedRecipe)"

                class="inline-flex items-center gap-2 rounded-lg border border-emerald-200 bg-emerald-50 px-3 py-2 text-sm font-semibold text-emerald-800 transition hover:bg-emerald-100 focus:outline-none focus:ring-2 focus:ring-emerald-300 disabled:opacity-60"

                <span aria-hidden="true">🛒</span><span x-text="t('addToShopping')"></span>
              </button>
              <span class="text-xs text-slate-500" x-text="t('addToShoppingNote')"></span>
            </div>
            <p

            >

              <button type="button" @click="openShoppingList()" class="font-semibold underline underline-offset-2 hover:text-emerald-950" x-text="t('openShoppingList')"></button>

            <p x-show="selectedRecipe && shoppingSaveError" x-cloak class="mt-3 rounded-lg bg-red-50 p-3 text-sm text-red-700" role="alert" x-text="shoppingSaveError"></p>

                :disabled="cookSaving"
                class="inline-flex items-center gap-2 rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm font-semibold text-slate-800 transition hover:bg-slate-100 focus:outline-none focus:ring-2 focus:ring-slate-300 disabled:cursor-wait disabled:opacity-60"
              >
                <span aria-hidden="true">🍳</span><span x-text="cookSaving ? t('saving') : t('markCooked')"></span>
              </button>
              <span class="text-xs text-slate-500" x-text="t('markCookedNote')"></span>

              role="status"
            >
              <span x-text="t('cookedSaved')"></span>
              <button type="button" @click="openHistory('meals')" class="font-semibold underline underline-offset-2 hover:text-emerald-950" x-text="t('historyNav')"></button>
            </p>
            <p x-show="selectedRecipe && cookError" x-cloak class="mt-3 rounded-lg bg-red-50 p-3 text-sm text-red-700" role="alert" x-text="cookError"></p>

              <template x-for="(step, index) in selectedRecipe ? recipeSteps(selectedRecipe) : []" :key="index">

                  <span class="grid h-7 w-7 shrink-0 place-items-center rounded-full bg-slate-100 text-xs font-bold text-slate-700" x-text="index + 1"></span>
                  <span x-text="step"></span>
                </li>
              </template>
            </ol>
            <p x-show="selectedRecipe && !recipeSteps(selectedRecipe).length" class="rounded-xl border border-dashed border-slate-200 px-4 py-5 text-sm text-slate-500" x-text="t('noSteps')"></p>
          </section>

          <section
            x-show="selectedRecipe && selectedRecipe.notes"
            class="rounded-xl border border-amber-100 bg-amber-50/70 p-4"
            aria-labelledby="detail-notes-heading"
          >
            <h3 id="detail-notes-heading" class="mb-1 text-sm font-semibold text-amber-900" x-text="t('notes')"></h3>
            <p class="whitespace-pre-line text-sm leading-relaxed text-amber-900/80" x-text="selectedRecipe ? selectedRecipe.notes : ''"></p>
          </section>

    <main x-show="showShoppingList && canUseShoppingList" x-cloak class="mx-auto max-w-2xl px-4 py-6 sm:px-6 sm:py-10" aria-labelledby="shopping-title">

        <div class="mb-5 flex items-start justify-between gap-3">
          <div>
            <button
              type="button"
              @click="closeShoppingList()"
              class="-ml-2 mb-2 inline-flex items-center gap-2 rounded-lg px-2 py-1.5 text-sm font-semibold text-slate-600 transition hover:bg-slate-100 hover:text-slate-900 focus:outline-none focus:ring-2 focus:ring-slate-400"
            >
              <span aria-hidden="true">←</span><span x-text="t('backToRecipes')"></span>
            </button>
            <div class="flex items-center gap-3">
              <img src="./icons/mascots/shopping-384.png" alt="" width="80" height="80" class="mascot mascot-hero h-16 w-16 shrink-0 sm:h-20 sm:w-20">
              <div class="min-w-0">
                <h1 id="shopping-title" class="text-2xl font-bold tracking-tight sm:text-3xl" x-text="t('shoppingList')"></h1>
                <p class="mt-1 text-sm text-slate-500" x-text="t('shoppingIntro')"></p>
              </div>
            </div>
          </div>
          <span
            class="mt-10 shrink-0 text-xs text-slate-500"

          ></span>
        </div>

        <div x-show="shoppingLoading" class="rounded-xl border border-slate-200 px-4 py-8 text-center text-sm text-slate-500" role="status" x-text="t('shoppingLoading')"></div>

          <p x-text="shoppingLoadError"></p>
          <button type="button" @click="loadShoppingList()" class="mt-3 rounded-lg bg-red-700 px-3 py-2 text-sm font-semibold text-white hover:bg-red-800" x-text="t('retry')"></button>
        </div>

        <div x-show="shoppingLoaded && !shoppingLoading">
          <form @submit.prevent="addShoppingDraft()" class="grid grid-cols-[minmax(0,1fr)_minmax(0,1fr)_auto] gap-2 sm:grid-cols-[minmax(0,1fr)_6rem_6rem_auto]" autocomplete="off">
            <label class="sr-only" for="shopping-name" x-text="t('shoppingItemName')"></label>
            <input id="shopping-name" x-model="shoppingDraft.name" maxlength="120" :placeholder="t('shoppingItemPlaceholder')" class="col-span-3 min-w-0 rounded-lg sm:col-span-1 border border-slate-200 px-3 py-2.5 outline-none focus:border-slate-400 focus:ring-2 focus:ring-slate-100">
            <label class="sr-only" for="shopping-amount" x-text="t('shoppingAmount')"></label>
            <input id="shopping-amount" x-model="shoppingDraft.amount" maxlength="40" inputmode="decimal" :placeholder="t('shoppingAmount')" class="min-w-0 rounded-lg border border-slate-200 px-3 py-2.5 outline-none focus:border-slate-400 focus:ring-2 focus:ring-slate-100">
            <label class="sr-only" for="shopping-unit" x-text="t('shoppingUnit')"></label>
            <input id="shopping-unit" x-model="shoppingDraft.unit" maxlength="40" :placeholder="t('shoppingUnit')" class="min-w-0 rounded-lg border border-slate-200 px-3 py-2.5 outline-none focus:border-slate-400 focus:ring-2 focus:ring-slate-100">
            <button type="submit" :disabled="!shoppingDraft.name.trim()" class="rounded-lg bg-slate-900 px-4 py-2.5 text-sm font-semibold text-white transition hover:bg-slate-700 disabled:cursor-not-allowed disabled:opacity-40" x-text="t('shoppingAdd')"></button>
          </form>

                <span x-text="tf('shoppingRemaining', { count: shoppingRemainingCount })"></span>
                <span x-show="shoppingCheckedCount" class="font-normal text-slate-500" x-text="` · ${tf('shoppingInBasket', { count: shoppingCheckedCount })}`"></span>

            </div>
            <ul class="divide-y divide-slate-100 rounded-xl border border-slate-200">
              <template x-for="row in shoppingRows" :key="row.index + '|' + row.item.name + '|' + row.item.unit">
                <li class="flex items-center gap-3 px-3 py-2.5 text-sm">
                  <label class="flex min-w-0 flex-1 cursor-pointer items-center gap-3">
                    <input
                      type="checkbox"
                      :checked="row.item.checked"
                      @change="toggleShoppingItem(row.index)"
                      :aria-label="tf('shoppingCheckItem', { name: row.item.name })"
                      class="h-5 w-5 shrink-0 rounded border-slate-300 text-emerald-600 accent-emerald-600"
                    >
                    <span class="min-w-0 flex-1 break-words font-medium" :class="row.item.checked ? 'text-slate-400 line-through' : 'text-slate-800'" x-text="row.item.name"></span>
                    <span class="shrink-0 text-right" :class="row.item.checked ? 'text-slate-400' : 'text-slate-500'" x-text="shoppingItemMeasure(row.item)"></span>
                  </label>
                  <button
                    type="button"
                    @click="removeShoppingItem(row.index)"
                    class="grid h-8 w-8 shrink-0 place-items-center rounded-lg text-lg leading-none text-slate-400 transition hover:bg-red-50 hover:text-red-700"
                    :aria-label="tf('shoppingRemoveItem', { name: row.item.name })"
                  >&times;</button>
                </li>
              </template>
            </ul>

            <div x-show="shoppingRecipes.length" class="mt-4 flex flex-wrap items-center gap-2 text-xs text-slate-500">

              >
                <span aria-hidden="true">✓</span><span x-text="finishingShopping ? t('saving') : t('finishShopping')"></span>
              </button>
              <p class="mt-1.5 text-xs text-slate-500" x-text="t('finishShoppingNote')"></p>
              <p x-show="finishShoppingError" x-cloak class="mt-3 rounded-lg bg-red-50 p-3 text-sm text-red-700" role="alert" x-text="finishShoppingError"></p>
            </div>

            <div class="mt-4 flex flex-wrap items-center gap-2">
              <button
                x-show="shoppingCheckedCount"
                type="button"
                @click="removeCheckedShoppingItems()"
                class="rounded-lg border border-slate-200 px-3 py-2 text-sm font-semibold text-slate-700 transition hover:bg-slate-100"
                x-text="t('shoppingRemoveChecked')"
              ></button>
              <button
                x-show="!shoppingConfirmClear"

                x-text="t('shoppingClear')"
              ></button>
              <div x-show="shoppingConfirmClear" class="flex flex-wrap items-center gap-2 rounded-lg bg-red-50 px-3 py-2 text-sm text-red-800" role="alert">
                <span x-text="t('shoppingClearConfirm')"></span>

                <button type="button" @click="shoppingConfirmClear = false" class="rounded-md px-2.5 py-1 font-semibold text-red-800 hover:bg-red-100" x-text="t('cancel')"></button>
              </div>
            </div>
          </div>

          <div x-show="!shoppingItems.length" class="mt-6 rounded-xl border border-dashed border-slate-300 px-6 py-10 text-center">
            <img src="./icons/mascots/shopping-384.png" alt="" width="128" height="128" class="mascot mx-auto h-32 w-32">
            <p class="mt-2 font-semibold text-slate-800" x-text="t('shoppingEmpty')"></p>
            <p class="mt-1 text-sm text-slate-500" x-text="t('shoppingEmptyHint')"></p>
          </div>
        </div>
      </section>
    </main>

              :class="historyTab === tab[0] ? 'border-slate-900 text-slate-950' : 'border-transparent text-slate-500 hover:text-slate-800'"

                <span class="min-w-0 flex-1">
                  <button x-show="recipeById(meal.recipe_id)" type="button" @click="openLinkedRecipe(recipeById(meal.recipe_id))" class="break-words text-left font-medium text-slate-800 underline-offset-2 hover:underline" x-text="meal.recipe_title"></button>
                  <span x-show="!recipeById(meal.recipe_id)" class="break-words font-medium text-slate-800" x-text="meal.recipe_title"></span>
                  <span class="block text-xs text-slate-500" x-text="tf('servingsShort', { servings: meal.servings })"></span>
                </span>
                <button
                  type="button"
                  @click="deleteHistoryEntry('meal', meal)"
                  :disabled="isHistorySaving('meal', meal.id)"
                  class="grid h-8 w-8 shrink-0 place-items-center rounded-lg text-lg leading-none text-slate-400 transition hover:bg-red-50 hover:text-red-700 disabled:opacity-40"
                  :aria-label="t('deleteEntry')"
                  :title="t('deleteEntry')"
                >&times;</button>
              </li>
            </template>
          </ul>
        </div>

        <div x-show="historyLoaded && historyTab === 'lists'" class="mt-5 space-y-4" role="tabpanel">
          <p x-show="!pastShoppingLists.length" class="rounded-xl border border-dashed border-slate-300 px-6 py-8 text-center text-sm text-slate-500" x-text="t('noPastLists')"></p>
          <template x-for="list in pastShoppingLists" :key="list.id">
            <article class="rounded-xl border border-slate-200 p-4">
              <div class="flex items-start justify-between gap-2">
                <div class="min-w-0">
                  <p class="text-sm font-semibold text-slate-900" x-text="formatDate(list.completed_at)"></p>
                  <p class="mt-0.5 text-xs text-slate-500" x-text="pastListProgress(list)"></p>
                </div>
                <button
                  type="button"
                  @click="deleteHistoryEntry('list', list)"
                  :disabled="isHistorySaving('list', list.id)"
                  class="grid h-8 w-8 shrink-0 place-items-center rounded-lg text-lg leading-none text-slate-400 transition hover:bg-red-50 hover:text-red-700 disabled:opacity-40"
                  :aria-label="t('deleteEntry')"
                  :title="t('deleteEntry')"
                >&times;</button>
              </div>
              <div x-show="pastListRecipes(list).length" class="mt-2 flex flex-wrap items-center gap-2 text-xs text-slate-500">
                <span x-text="t('shoppingFromRecipes')"></span>
                <template x-for="recipe in pastListRecipes(list)" :key="recipe.id">
                  <button type="button" @click="openLinkedRecipe(recipe)" class="rounded-full border border-slate-200 px-2.5 py-1 font-medium text-slate-700 hover:bg-slate-100" x-text="displayTitle(recipe)"></button>
                </template>
              </div>
              <ul class="mt-3 divide-y divide-slate-100 rounded-lg border border-slate-200">
                <template x-for="(item, index) in pastListItems(list)" :key="index">
                  <li class="flex items-center gap-3 px-3 py-2 text-sm">
                    <span class="w-4 shrink-0 text-center text-emerald-600" aria-hidden="true" x-text="item.checked ? '✓' : ''"></span>
                    <span class="min-w-0 flex-1 break-words" :class="item.checked ? 'text-slate-500' : 'text-slate-800'" x-text="item.name"></span>
                    <span class="shrink-0 text-right text-slate-500" x-text="shoppingItemMeasure(item)"></span>
                  </li>
                </template>
              </ul>
            </article>
          </template>
        </div>
      </section>
    </main>

    <main x-show="showForm" x-cloak class="mx-auto max-w-3xl px-4 py-6 sm:px-6 sm:py-10" aria-labelledby="form-title">
      <section x-show="canEdit" class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm sm:p-8">
        <button type="button" @click="closeForm()" class="mb-6 inline-flex items-center gap-2 text-sm font-semibold text-slate-600 hover:text-slate-950">
          <span aria-hidden="true">←</span>
          <span x-text="t('backToRecipes')"></span>
        </button>
        <div class="mb-6">
          <div>
            <p class="text-sm font-medium text-slate-500" x-text="t(editingRecipeId !== null ? 'editFormEyebrow' : 'formEyebrow')"></p>
            <h1 id="form-title" class="mt-1 text-2xl font-bold tracking-tight sm:text-3xl" x-text="t(editingRecipeId !== null ? 'editRecipeTitle' : 'addRecipeTitle')"></h1>
          </div>
        </div>
        <section x-show="editingRecipeId === null" class="mb-6 rounded-xl border border-slate-200 bg-slate-50/70 p-4" aria-labelledby="import-heading" aria-describedby="import-note">
          <h2 id="import-heading" class="text-sm font-semibold text-slate-800" x-text="t('importHeading')"></h2>
          <p id="import-note" class="mb-3 mt-1 text-xs text-slate-500" x-text="t('importNote')"></p>
          <form @submit.prevent="importRecipe()" class="flex flex-col gap-2 sm:flex-row">
            <label class="sr-only" for="import-url" x-text="t('importUrl')"></label>
            <input id="import-url" type="url" inputmode="url" autocomplete="off" x-model.trim="importUrl" :disabled="importing" placeholder="https://" maxlength="2048" class="w-full rounded-lg border border-slate-200 bg-white px-3 py-2.5 outline-none focus:border-slate-400 focus:ring-2 focus:ring-slate-100 disabled:opacity-60">
            <button type="submit" :disabled="importing || saving || !importUrl" class="shrink-0 rounded-lg bg-slate-900 px-4 py-2.5 text-sm font-semibold text-white hover:bg-slate-700 disabled:cursor-not-allowed disabled:opacity-60" x-text="t('importButton')"></button>
          </form>
          <p x-show="importing" x-cloak class="mt-3 text-sm text-slate-600" role="status" x-text="t('importing')"></p>
          <p x-show="importMessage && !importing" x-cloak class="mt-3 rounded-lg bg-emerald-50 p-3 text-sm text-emerald-800" role="status" x-text="importMessage"></p>
          <p x-show="importError && !importing" x-cloak class="mt-3 rounded-lg bg-red-50 p-3 text-sm text-red-700" role="alert" x-text="importError"></p>
        </section>
        <form @submit.prevent="addRecipe()" class="space-y-4">
          <div class="grid gap-4 sm:grid-cols-2">
            <label x-show="isLanguageEnabled('cs')" class="block text-sm font-medium text-slate-700">
              <span x-text="t('recipeNameCs')"></span>
              <input type="text" x-model.trim="newRecipe.title_cs" :required="isLanguageEnabled('cs') && !newRecipe.title_sk" maxlength="160" class="mt-1.5 w-full rounded-lg border border-slate-200 px-3 py-2.5 outline-none focus:border-slate-400 focus:ring-2 focus:ring-slate-100">
            </label>
            <label class="block text-sm font-medium text-slate-700">
              <span x-text="t('recipeNameSk')"></span>
              <input type="text" x-model.trim="newRecipe.title_sk" :required="!newRecipe.title_cs" maxlength="160" class="mt-1.5 w-full rounded-lg border border-slate-200 px-3 py-2.5 outline-none focus:border-slate-400 focus:ring-2 focus:ring-slate-100">
            </label>
            <label x-show="isLanguageEnabled('cs')" class="block text-sm font-medium text-slate-700">
              <span x-text="t('categoryCs')"></span>
              <input type="text" x-model.trim="newRecipe.category_cs" :required="isLanguageEnabled('cs') && !newRecipe.category_sk" maxlength="80" class="mt-1.5 w-full rounded-lg border border-slate-200 px-3 py-2.5 outline-none focus:border-slate-400 focus:ring-2 focus:ring-slate-100">
            </label>
            <label class="block text-sm font-medium text-slate-700">
              <span x-text="t('categorySk')"></span>
              <input type="text" x-model.trim="newRecipe.category_sk" :required="!newRecipe.category_cs" maxlength="80" class="mt-1.5 w-full rounded-lg border border-slate-200 px-3 py-2.5 outline-none focus:border-slate-400 focus:ring-2 focus:ring-slate-100">
            </label>
          </div>
          <section class="rounded-xl border border-slate-200 bg-slate-50/70 p-4" aria-labelledby="nutrition-per-100g-heading" aria-describedby="nutrition-per-100g-note">
            <h3 id="nutrition-per-100g-heading" class="text-sm font-semibold text-slate-800" x-text="t('nutritionPer100g')"></h3>
            <p id="nutrition-per-100g-note" class="mb-3 mt-1 text-xs text-slate-500" x-text="t('nutritionPer100gNote')"></p>
            <div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
              <label class="block text-sm font-medium text-slate-700">
                <span x-text="t('calories')"></span>
                <input type="text" inputmode="decimal" x-model.trim="newRecipe.calories" class="mt-1.5 w-full rounded-lg border border-slate-200 bg-white px-3 py-2.5 outline-none focus:border-slate-400 focus:ring-2 focus:ring-slate-100">
              </label>
              <label class="block text-sm font-medium text-slate-700">
                <span x-text="t('carbs')"></span>
                <input type="text" inputmode="decimal" x-model.trim="newRecipe.carbs" class="mt-1.5 w-full rounded-lg border border-slate-200 bg-white px-3 py-2.5 outline-none focus:border-slate-400 focus:ring-2 focus:ring-slate-100">
              </label>
              <label class="block text-sm font-medium text-slate-700">
                <span x-text="t('proteins')"></span>
                <input type="text" inputmode="decimal" x-model.trim="newRecipe.proteins" class="mt-1.5 w-full rounded-lg border border-slate-200 bg-white px-3 py-2.5 outline-none focus:border-slate-400 focus:ring-2 focus:ring-slate-100">
              </label>
              <label class="block text-sm font-medium text-slate-700">
                <span x-text="t('fats')"></span>
                <input type="text" inputmode="decimal" x-model.trim="newRecipe.fats" class="mt-1.5 w-full rounded-lg border border-slate-200 bg-white px-3 py-2.5 outline-none focus:border-slate-400 focus:ring-2 focus:ring-slate-100">
              </label>
              <label class="block text-sm font-medium text-slate-700">
                <span x-text="t('fiber')"></span>
                <input type="text" inputmode="decimal" x-model.trim="newRecipe.fiber" class="mt-1.5 w-full rounded-lg border border-slate-200 bg-white px-3 py-2.5 outline-none focus:border-slate-400 focus:ring-2 focus:ring-slate-100">
              </label>
              <label class="block text-sm font-medium text-slate-700">
                <span x-text="t('salt')"></span>
                <input type="text" inputmode="decimal" x-model.trim="newRecipe.salt" class="mt-1.5 w-full rounded-lg border border-slate-200 bg-white px-3 py-2.5 outline-none focus:border-slate-400 focus:ring-2 focus:ring-slate-100">
              </label>
            </div>
          </section>
          <section class="rounded-xl border border-slate-200 bg-slate-50/70 p-4" aria-labelledby="nutrition-glycemic-heading" aria-describedby="nutrition-glycemic-note">
            <h3 id="nutrition-glycemic-heading" class="text-sm font-semibold text-slate-800" x-text="t('glycemicValues')"></h3>
            <p id="nutrition-glycemic-note" class="mb-3 mt-1 text-xs text-slate-500" x-text="t('glycemicValuesNote')"></p>
            <div class="grid gap-4 sm:grid-cols-3">
              <label class="block text-sm font-medium text-slate-700">
                <span x-text="t('sj')"></span> <span class="text-xs font-normal text-slate-500" x-text="`(${t('per100g')})`"></span>
                <input type="text" inputmode="decimal" x-model.trim="newRecipe.sj" class="mt-1.5 w-full rounded-lg border border-slate-200 bg-white px-3 py-2.5 outline-none focus:border-slate-400 focus:ring-2 focus:ring-slate-100">
              </label>
              <label class="block text-sm font-medium text-slate-700">
                <span x-text="t('gi')"></span>
                <input
                  type="text"
                  inputmode="decimal"
                  x-model.trim="newRecipe.gi"
                  maxlength="40"
                  placeholder="0–100"
                  aria-describedby="gi-hint"
                  :aria-invalid="isGiInvalid(newRecipe.gi)"
                  class="mt-1.5 w-full rounded-lg border border-slate-200 bg-white px-3 py-2.5 outline-none focus:border-slate-400 focus:ring-2 focus:ring-slate-100"
                  :class="isGiInvalid(newRecipe.gi) ? 'border-red-300' : ''"
                >
                <span id="gi-hint" class="mt-1 block text-xs font-normal" :class="isGiInvalid(newRecipe.gi) ? 'text-red-700' : 'text-slate-500'" x-text="isGiInvalid(newRecipe.gi) ? t('giInvalid') : t('giHint')"></span>
                <span x-show="giLabel(newRecipe.gi)" class="mt-1 inline-flex rounded-full px-2 py-0.5 text-xs font-semibold" :class="giClass(newRecipe.gi)" x-text="giLabel(newRecipe.gi)"></span>
              </label>
              <label class="block text-sm font-medium text-slate-700">
                <span x-text="t('glycemicLoad')"></span>
                <input type="text" inputmode="decimal" x-model.trim="newRecipe.glycemic_load" class="mt-1.5 w-full rounded-lg border border-slate-200 bg-white px-3 py-2.5 outline-none focus:border-slate-400 focus:ring-2 focus:ring-slate-100">
              </label>
            </div>
          </section>
          <div x-show="formNutritionConflicts.length" x-cloak id="form-nutrition-conflicts" class="rounded-xl border border-amber-200 bg-amber-50 p-3 text-sm text-amber-900" role="status">
            <p class="font-semibold" x-text="t('conflictTitle')"></p>
            <template x-for="conflict in formNutritionConflicts" :key="conflict.field">
              <p class="mt-1" x-text="conflictMessage(conflict)"></p>
            </template>
          </div>
          <section class="rounded-xl border border-slate-200 bg-slate-50/70 p-4" aria-labelledby="nutrition-total-heading" aria-describedby="nutrition-total-note">
            <h3 id="nutrition-total-heading" class="text-sm font-semibold text-slate-800" x-text="t('totalRecipeValues')"></h3>
            <p id="nutrition-total-note" class="mb-3 mt-1 text-xs text-slate-500" x-text="t('totalRecipeNote')"></p>
            <div class="grid gap-4 sm:grid-cols-2">
              <label class="block text-sm font-medium text-slate-700">
                <span x-text="t('servings')"></span>
                <input type="text" inputmode="decimal" x-model.trim="newRecipe.servings" class="mt-1.5 w-full rounded-lg border border-slate-200 bg-white px-3 py-2.5 outline-none focus:border-slate-400 focus:ring-2 focus:ring-slate-100">
              </label>
              <label class="block text-sm font-medium text-slate-700">
                <span x-text="t('totalWeight')"></span>
                <input type="text" inputmode="decimal" x-model.trim="newRecipe.total_weight" class="mt-1.5 w-full rounded-lg border border-slate-200 bg-white px-3 py-2.5 outline-none focus:border-slate-400 focus:ring-2 focus:ring-slate-100">
              </label>
            </div>
          </section>
          <section class="rounded-xl border border-slate-200 bg-slate-50/70 p-4" aria-labelledby="ingredients-heading">
            <div class="mb-3 flex items-center justify-between gap-3">
              <h3 id="ingredients-heading" class="text-sm font-semibold text-slate-800" x-text="t('ingredients')"></h3>
              <button
                type="button"
                @click="newRecipe.ingredients.push({ name: '', amount: '', unit: '' })"
                class="rounded-lg border border-slate-200 bg-white px-3 py-1.5 text-sm font-semibold text-slate-700 transition hover:bg-slate-100"
                x-text="t('addIngredient')"
              ></button>
            </div>
            <div class="space-y-3">
              <template x-for="(ingredient, index) in newRecipe.ingredients" :key="index">
                <div class="grid gap-2 sm:grid-cols-[minmax(0,1fr)_minmax(0,0.65fr)_minmax(0,0.65fr)_auto] sm:items-end">
                  <label class="block text-xs font-medium text-slate-600">
                    <span x-text="t('ingredientName')"></span>
                    <input type="text" x-model.trim="ingredient.name" maxlength="120" class="mt-1 w-full rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm text-slate-900 outline-none focus:border-slate-400 focus:ring-2 focus:ring-slate-100">
                  </label>
                  <label class="block text-xs font-medium text-slate-600">
                    <span x-text="t('amount')"></span>
                    <input type="text" x-model.trim="ingredient.amount" maxlength="40" class="mt-1 w-full rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm text-slate-900 outline-none focus:border-slate-400 focus:ring-2 focus:ring-slate-100">
                  </label>
                  <label class="block text-xs font-medium text-slate-600">
                    <span x-text="t('unit')"></span>
                    <input type="text" x-model.trim="ingredient.unit" maxlength="40" class="mt-1 w-full rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm text-slate-900 outline-none focus:border-slate-400 focus:ring-2 focus:ring-slate-100">
                  </label>
                  <button
                    type="button"
                    @click="newRecipe.ingredients.splice(index, 1)"
                    :aria-label="t('removeIngredient')"
                    class="rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm font-semibold text-slate-500 transition hover:border-red-200 hover:bg-red-50 hover:text-red-700"
                  >×</button>
                </div>
              </template>
            </div>
          </section>
          <section class="rounded-xl border border-slate-200 bg-slate-50/70 p-4" aria-labelledby="steps-heading">
            <div class="mb-3 flex items-center justify-between gap-3">
              <h3 id="steps-heading" class="text-sm font-semibold text-slate-800" x-text="t('steps')"></h3>
              <button
                type="button"
                @click="newRecipe.steps.push('')"
                class="rounded-lg border border-slate-200 bg-white px-3 py-1.5 text-sm font-semibold text-slate-700 transition hover:bg-slate-100"
                x-text="t('addStep')"
              ></button>
            </div>
            <div class="space-y-2">
              <template x-for="(step, index) in newRecipe.steps" :key="index">
                <div class="flex items-start gap-2">
                  <label class="min-w-0 flex-1 text-xs font-medium text-slate-600">
                    <span><span x-text="t('step')"></span> <span x-text="index + 1"></span></span>
                    <textarea x-model.trim="newRecipe.steps[index]" rows="2" maxlength="1000" class="mt-1 w-full resize-y rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm text-slate-900 outline-none focus:border-slate-400 focus:ring-2 focus:ring-slate-100"></textarea>
                  </label>
                  <button
                    type="button"
                    @click="newRecipe.steps.splice(index, 1)"
                    :aria-label="t('removeStep')"
                    class="mt-5 rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm font-semibold text-slate-500 transition hover:border-red-200 hover:bg-red-50 hover:text-red-700"
                  >×</button>
                </div>
              </template>
            </div>
          </section>
          <label class="block text-sm font-medium text-slate-700">
            <span x-text="t('notes')"></span>
            <textarea x-model.trim="newRecipe.notes" rows="3" maxlength="2000" :placeholder="t('notesPlaceholder')" class="mt-1.5 w-full resize-y rounded-lg border border-slate-200 px-3 py-2.5 outline-none placeholder:text-slate-400 focus:border-slate-400 focus:ring-2 focus:ring-slate-100"></textarea>
          </label>
          <label class="block text-sm font-medium text-slate-700">
            <span x-text="t('sideDishField')"></span>
            <select x-model="newRecipe.side_recipe_id" class="mt-1.5 w-full rounded-lg border border-slate-200 bg-white px-3 py-2.5 outline-none focus:border-slate-400 focus:ring-2 focus:ring-slate-100">
              <option value="" x-text="t('noSideDish')"></option>
              <template x-for="option in sideRecipeOptions" :key="option.id">
                <option :value="option.id" :selected="String(newRecipe.side_recipe_id ?? '') === option.id" x-text="option.title"></option>
              </template>
            </select>
            <span class="mt-1 block text-xs font-normal text-slate-500" x-text="t('sideDishHint')"></span>
          </label>
          <label class="block text-sm font-medium text-slate-700">
            <span x-text="t('photoUrl')"></span>
            <input type="url" x-model.trim="newRecipe.photo" maxlength="2048" class="mt-1.5 w-full rounded-lg border border-slate-200 px-3 py-2.5 outline-none focus:border-slate-400 focus:ring-2 focus:ring-slate-100">
          </label>
          <div class="flex flex-wrap items-center gap-3">
            <img x-show="newRecipe.photo" :src="newRecipe.photo" alt="" class="h-16 w-16 rounded-lg object-cover">
            <label class="inline-flex cursor-pointer items-center rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm font-semibold text-slate-700 transition hover:bg-slate-100" :class="photoUploading && 'pointer-events-none opacity-60'">
              <input type="file" accept="image/*" class="sr-only" @change="uploadPhoto($event)" :disabled="photoUploading">
              <span x-text="photoUploading ? t('uploadingPhoto') : t('uploadPhoto')"></span>
            </label>
            <p x-show="photoError" x-cloak class="w-full rounded-lg bg-red-50 p-3 text-sm text-red-700" role="alert" x-text="photoError"></p>
          </div>
          <p x-show="formError" x-cloak class="rounded-lg bg-red-50 p-3 text-sm text-red-700" role="alert" x-text="formError"></p>
          <div class="flex flex-col-reverse gap-2 pt-2 sm:flex-row sm:justify-end">
            <button type="button" @click="closeForm()" class="rounded-lg border border-slate-200 px-4 py-2.5 text-sm font-semibold text-slate-700 hover:bg-slate-50" x-text="t('cancel')"></button>
            <button type="submit" :disabled="saving || photoUploading" class="rounded-lg bg-slate-900 px-5 py-2.5 text-sm font-semibold text-white hover:bg-slate-700 disabled:cursor-not-allowed disabled:opacity-60" x-text="saving ? t('saving') : t(editingRecipeId !== null ? 'updateRecipe' : 'saveRecipe')"></button>
          </div>
        </form>
      </section>
    </main>

    <footer class="border-t border-slate-200 bg-white py-5 text-center text-xs text-slate-500">
      hamMňam <span aria-hidden="true">·</span> <span x-text="t('footer')"></span>
    </footer>
    <style>[x-cloak] { display: none !important; }</style>
  </body>
</html>
